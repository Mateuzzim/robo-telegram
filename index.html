<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dashboard - Sistema de Robos</title>
<link rel="stylesheet" href="style.css">
<style>
  .hero{background:linear-gradient(135deg,rgba(35,104,255,.15),rgba(41,217,120,.1));border:1px solid var(--border);border-radius:16px;padding:24px 30px;margin-bottom:24px;position:relative;overflow:hidden}
  .hero::before{content:'';position:absolute;top:-50%;right:-10%;width:300px;height:300px;background:radial-gradient(circle,rgba(35,104,255,.08),transparent 70%);border-radius:50%}
  .hero::after{content:'';position:absolute;bottom:-40%;left:10%;width:200px;height:200px;background:radial-gradient(circle,rgba(41,217,120,.06),transparent 70%);border-radius:50%}
  .hero h1{font-size:26px;font-weight:800;margin-bottom:4px;position:relative;z-index:1;display:flex;align-items:center;gap:10px}
  .hero h1 .logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--green));display:flex;align-items:center;justify-content:center}
  html{zoom:0.75}
  .hero p{color:var(--text3);font-size:13px;position:relative;z-index:1}
  .stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;transition:all .2s}
  .stat-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .stat-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:4px 0 0 4px}
  .stat-card.green::before{background:var(--green)}
  .stat-card.red::before{background:var(--red)}
  .stat-card.yellow::before{background:var(--yellow)}
  .stat-card.blue::before{background:var(--blue)}
  .stat-card .stat-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
  .stat-card .stat-value{font-size:28px;font-weight:800;line-height:1}
  .stat-card .stat-label{font-size:11px;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
  .robot-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;transition:all .2s;cursor:pointer}
  .robot-card:hover{border-color:var(--blue);background:var(--bg3)}
  .robot-card .rc-info{display:flex;align-items:center;gap:10px}
  .robot-card .rc-icon{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700}
  .robot-card .rc-name{font-weight:700;font-size:13px}
  .robot-card .rc-meta{font-size:11px;color:var(--text3)}
  .robot-card .rc-right{display:flex;align-items:center;gap:8px}
  .feed-item{padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;display:flex;gap:8px;align-items:flex-start}
  .feed-item:last-child{border-bottom:none}
  .feed-time{color:var(--text3);font-size:10px;min-width:44px;font-family:monospace}
  .feed-msg{flex:1}
  .signal-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
  .signal-row:last-child{border-bottom:none}
  .section-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .section-title .dot-accent{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .live-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .live-dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
  .live-dot.off{background:var(--red)}
</style>
</head>
<body>
<nav class="nav">
  <span class="nav-brand">ROBOS</span>
  <div class="nav-links">
    <a href="index.html" class="active">Dashboard</a>
    <a href="monitoramento.html">Monitoramento</a>
    <a href="robos.html">Robos</a>
    <a href="configuracoes.html">Config</a>
    <a href="estatisticas.html">Estatisticas</a>
    <a href="logs.html">Logs</a>
    <a href="historico-wheel.html">Wheel</a>
    <a href="historico-double.html">Double</a>
    <a href="mensagens.html">Mensagens</a>
  </div>
  <div class="nav-status">
    <a href="ws-background.html" target="_blank" style="font-size:11px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;color:var(--text3);margin-right:8px">BG</a>
    <div class="dot" id="connDot"></div>
    <span id="connText" style="font-size:12px;color:var(--text2)">Conectando...</span>
  </div>
</nav>
<div class="container">
  <div class="hero">
    <h1><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="8.5" cy="16" r="1.5"/><circle cx="15.5" cy="16" r="1.5"/><path d="M12 11V7"/><path d="M8 7h8"/></svg></div> Sistema de Robos</h1>
    <p>Dashboard em tempo real &bull; Monitore seus robos, sinais e resultados</p>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px" id="stats"></div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
    <div class="card">
      <div class="section-title"><span class="dot-accent"></span> Robos Ativos</div>
      <div id="robotsList" style="max-height:380px;overflow-y:auto"></div>
    </div>
    <div class="card">
      <div class="section-title"><span class="dot-accent"></span> Feed Global</div>
      <div id="feed" style="max-height:380px;overflow-y:auto"></div>
    </div>
  </div>

  <div class="card">
    <div class="section-title"><span class="dot-accent"></span> Ultimos Sinais</div>
    <div id="signalsList" style="max-height:300px;overflow-y:auto"></div>
  </div>
</div>
<script src="config.js"></script>
<script src="saved-data.js"></script>
<script src="store.js"></script>
<script src="event-bus.js"></script>
<script src="utils.js"></script>
<script src="ws-source.js"></script>
<script src="robot.js"></script>
<script src="robot-engine.js"></script>
<script src="telegram.js"></script>
<script src="app.js"></script>
<script>
App.init();
const feedEl = document.getElementById('feed');
const statsEl = document.getElementById('stats');
const robotsEl = document.getElementById('robotsList');
const signalsEl = document.getElementById('signalsList');
const connDot = document.getElementById('connDot');
const connText = document.getElementById('connText');
let feedEvents = [];
let signalEvents = [];

EventBus.on('ws-status', (d) => {
  if (d.label === 'wheel') {
    connDot.className = 'dot' + (d.connected ? '' : ' off');
    connText.textContent = d.connected ? 'Online' : 'Offline';
  }
});

function renderConnectionStatus() {
  const status = App.getSourceStatus('wheel');
  connDot.className = 'dot' + (status.connected ? '' : ' off');
  connText.textContent = status.connected ? 'Online' : 'Offline';
}

EventBus.on('robot:log', (d) => { upsertFeedEvent(d); renderFeed(); });
EventBus.on('signal:created', (d) => { upsertSignalEvent(d); upsertFeedEvent({ time: d.createdAt || Date.now(), id: d.robotId, message: 'Sinal: ' + d.target }); renderDashboard(); renderSignals(); renderFeed(); });
EventBus.on('signal:gale', (d) => { upsertSignalEvent(d); upsertFeedEvent({ time: Date.now(), id: d.robotId, message: 'Gale ' + (d.gale || 1) + ': ' + d.target }); renderDashboard(); renderSignals(); renderFeed(); });
EventBus.on('signal:win', (d) => { upsertSignalEvent(d); upsertFeedEvent({ time: Date.now(), id: d.robotId, message: 'WIN! ' + d.target }); renderDashboard(); renderSignals(); renderFeed(); });
EventBus.on('signal:loss', (d) => { upsertSignalEvent(d); upsertFeedEvent({ time: Date.now(), id: d.robotId, message: 'LOSS! ' + d.target }); renderDashboard(); renderSignals(); renderFeed(); });
EventBus.on('robot:state', () => { renderDashboard(); renderSignals(); renderFeed(); });
EventBus.on('robots:synced', () => { renderDashboard(); renderSignals(); renderFeed(); });

function renderFeed() {
  const entries = getGlobalFeedEntries();
  if (!entries.length) { feedEl.innerHTML = '<div style="color:var(--text3);text-align:center;padding:20px;font-size:12px">Nenhum evento registrado</div>'; return; }
  feedEl.innerHTML = entries.slice(0, 30).map(e => {
    const msg = e.message || '';
    const cls = msg.includes('WIN') ? 'color:var(--green)' : msg.includes('LOSS') ? 'color:var(--red)' : msg.includes('SINAL') || msg.includes('Sinal') ? 'color:var(--blue)' : '';
    return `<div class="feed-item"><span class="feed-time">${formatTime(e.time)}</span><span class="feed-msg" style="${cls}">${escapeHtml(msg)}</span></div>`;
  }).join('');
}

function upsertFeedEvent(entry) {
  if (!entry || !entry.message) return;
  const normalized = { ...entry, time: entry.time || Date.now() };
  const key = getFeedKey(normalized);
  feedEvents = feedEvents.filter(e => getFeedKey(e) !== key);
  feedEvents.unshift(normalized);
  if (feedEvents.length > 200) feedEvents.length = 200;
}

function getGlobalFeedEntries() {
  const byKey = new Map();
  getStoredFeedEntries().forEach(entry => addFeedToMap(byKey, entry));
  feedEvents.forEach(entry => addFeedToMap(byKey, entry));
  return [...byKey.values()].sort((a, b) => (b.time || 0) - (a.time || 0)).slice(0, 200);
}

function getStoredFeedEntries() {
  return RobotEngine.getAllStates().flatMap(robot => (robot.logs || []).map(log => ({ ...log, id: log.id || robot.id, robotName: robot.name, time: log.time || robot.lastHeartbeat || 0 })));
}

function addFeedToMap(map, entry) {
  if (!entry || !entry.message) return;
  const key = getFeedKey(entry);
  const current = map.get(key);
  if (!current || (entry.time || 0) >= (current.time || 0)) map.set(key, entry);
}

function getFeedKey(entry) { return [entry.id || '', entry.time || '', entry.message || ''].join('|'); }

function renderSignals() {
  const signals = getLatestSignals();
  if (!signals.length) { signalsEl.innerHTML = '<div style="color:var(--text3);text-align:center;padding:20px;font-size:12px">Nenhum sinal registrado</div>'; return; }
  signalsEl.innerHTML = signals.slice(0, 15).map(s => {
    const statusColors = { win: 'var(--green)', loss: 'var(--red)', gale_pending: 'var(--yellow)', approved: 'var(--blue)' };
    const statusLabels = { approved: 'Sinal', gale_pending: 'Gale', win: 'Win', loss: 'Loss' };
    const st = String(s.status || 'approved').toLowerCase();
    const sc = statusColors[st] || 'var(--text3)';
    return `<div class="signal-row">
      <span class="live-dot on" style="background:${sc};box-shadow:0 0 6px ${sc}"></span>
      <span style="font-weight:700;min-width:80px">${escapeHtml(s.robotName || '--')}</span>
      <span style="color:var(--blue);font-weight:600;min-width:60px">${escapeHtml(formatSignalTarget(s))}</span>
      <span style="font-weight:800;color:${sc}">${s.confidence || 0}%</span>
      <span style="padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;background:${sc}22;color:${sc};border:1px solid ${sc}44">${statusLabels[st] || st}</span>
      <span style="margin-left:auto;color:var(--text3);font-size:11px">${formatTime(s.createdAt)}</span>
    </div>`;
  }).join('');
}

function upsertSignalEvent(signal) {
  if (!signal) return;
  const key = getSignalKey(signal);
  signalEvents = signalEvents.filter(s => getSignalKey(s) !== key);
  signalEvents.unshift({ ...signal, updatedAt: Date.now() });
  if (signalEvents.length > 100) signalEvents.length = 100;
}

function getLatestSignals() {
  const byKey = new Map();
  signalEvents.forEach(signal => addSignalToMap(byKey, signal));
  RobotEngine.getAllStates().forEach(robot => {
    addSignalToMap(byKey, normalizeRobotSignal(robot, robot.currentSignal));
    addSignalToMap(byKey, normalizeRobotSignal(robot, robot.lastSignal));
  });
  return [...byKey.values()].sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
}

function normalizeRobotSignal(robot, signal) {
  if (!signal) return null;
  return { ...signal, robotId: signal.robotId || robot.id, robotName: robot.name, game: signal.game || robot.game, createdAt: signal.createdAt || robot.lastSignalTime || robot.lastHeartbeat || Date.now(), updatedAt: signal.result?.time || signal.updatedAt || signal.createdAt || robot.lastSignalTime || Date.now() };
}

function addSignalToMap(map, signal) {
  if (!signal) return;
  const key = getSignalKey(signal);
  const current = map.get(key);
  if (!current || (signal.updatedAt || signal.createdAt || 0) >= (current.updatedAt || current.createdAt || 0)) map.set(key, signal);
}

function getSignalKey(signal) { return signal.id || [signal.robotId || '', signal.createdAt || '', signal.target || ''].join('|'); }

function formatSignalTarget(signal) {
  const target = String(signal.target || '--').toUpperCase();
  const labels = { RED: 'Vermelho', BLACK: 'Preto', GREY: 'Preto', GREEN: 'Verde', BLUE: 'Azul', WHITE: 'Branco' };
  return labels[target] || target;
}

function renderDashboard() {
  const robots = RobotEngine.getAllStates();
  const online = robots.filter(r => r.status === 'online').length;
  const offline = robots.filter(r => r.status === 'offline').length;
  const paused = robots.filter(r => r.status === 'paused').length;
  const totalSignals = robots.reduce((s, r) => s + (r.stats?.signals || 0), 0);
  const totalWins = robots.reduce((s, r) => s + (r.stats?.wins || 0), 0);
  const totalLosses = robots.reduce((s, r) => s + (r.stats?.losses || 0), 0);
  const rate = totalSignals > 0 ? Math.round((totalWins / totalSignals) * 100) : 0;

  statsEl.innerHTML = `
    <div class="stat-card green"><div class="stat-icon" style="background:rgba(41,217,120,.15)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div class="stat-value" style="color:var(--green)">${online}</div><div class="stat-label">Online</div></div>
    <div class="stat-card red"><div class="stat-icon" style="background:rgba(255,68,68,.15)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div><div class="stat-value" style="color:var(--red)">${offline}</div><div class="stat-label">Offline</div></div>
    <div class="stat-card blue"><div class="stat-icon" style="background:rgba(35,104,255,.15)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div><div class="stat-value" style="color:var(--blue)">${totalSignals}</div><div class="stat-label">Sinais</div></div>
    <div class="stat-card green"><div class="stat-icon" style="background:rgba(41,217,120,.15)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg></div><div class="stat-value" style="color:var(--green)">${rate}%</div><div class="stat-label">Assertividade</div></div>`;

  robotsEl.innerHTML = robots.map(r => {
    const bg = r.status === 'online' ? 'rgba(41,217,120,.12)' : r.status === 'paused' ? 'rgba(224,197,64,.12)' : 'rgba(255,68,68,.08)';
    const color = r.status === 'online' ? 'var(--green)' : r.status === 'paused' ? 'var(--yellow)' : 'var(--red)';
    const icon = r.status === 'online' ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="'+color+'" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>' : r.status === 'paused' ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="'+color+'" stroke="none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>' : '<svg width="14" height="14" viewBox="0 0 24 24" fill="'+color+'" stroke="none"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>';
    const wins = r.stats?.wins || 0;
    const losses = r.stats?.losses || 0;
    const total = wins + losses;
    const rate = total > 0 ? Math.round((wins / total) * 100) : 0;
    return `<div class="robot-card" onclick="location.href='robo.html?id=${r.id}'">
      <div class="rc-info">
        <div class="rc-icon" style="background:${bg};color:${color}">${icon}</div>
        <div>
          <div class="rc-name">${escapeHtml(r.name)}</div>
          <div class="rc-meta">${r.strategy} &bull; ${r.game} &bull; ${wins}W ${losses}L (${rate}%)</div>
        </div>
      </div>
      <div class="rc-right">
        <span class="live-dot ${r.status==='online'?'on':'off'}"></span>
        <span style="color:${color};font-size:11px;font-weight:700">${r.status.toUpperCase()}</span>
      </div>
    </div>`;
  }).join('') || '<div style="color:var(--text3);text-align:center;padding:20px;font-size:12px">Nenhum robo criado</div>';
}

renderDashboard();
renderFeed();
renderSignals();
renderConnectionStatus();
setInterval(renderDashboard, 5000);
setInterval(renderFeed, 5000);
setInterval(renderSignals, 5000);
setInterval(renderConnectionStatus, 2000);
</script>
</body>
</html>
