  </defs>
  <rect width="512" height="512" rx="102" fill="url(#bg)"/>
  <g transform="translate(256,256)" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <rect x="-86" y="-32" width="172" height="106" rx="16"/>
    <circle cx="-44" cy="30" r="10" fill="white" stroke="none"/>
    <circle cx="44" cy="30" r="10" fill="white" stroke="none"/>
