<style>
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:999}
  .modal{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:18px;max-width:420px;width:90%}
  .modal h3{margin:0 0 10px}
  .modal select{width:100%;padding:8px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;margin-bottom:12px}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end}
  .cfg-section{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)}
  .cfg-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
  .cfg-section-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .cfg-row{display:grid;gap:8px;margin-bottom:8px}
  .cfg-row:last-child{margin-bottom:0}
  .cfg-cols-2{grid-template-columns:1fr 1fr}
  .cfg-cols-3{grid-template-columns:1fr 1fr 1fr}
  .cfg-cols-4{grid-template-columns:1fr 1fr 1fr 1fr}
  .cfg-cols-5{grid-template-columns:1fr 1fr 1fr 1fr 1fr}
  .cfg-field{display:flex;flex-direction:column}
  .cfg-field label{font-size:10px;color:var(--text3);margin-bottom:2px}
  .cfg-field input,.cfg-field select{width:100%;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px}
  .cfg-field input:focus,.cfg-field select:focus{outline:none;border-color:var(--blue)}
  .cfg-hint{font-size:9px;color:var(--text3);margin-top:1px}
  .cfg-checkbox{display:flex;align-items:center;gap:6px;font-size:11px;cursor:pointer;padding:6px 8px;background:var(--bg2);border:1px solid var(--border);border-radius:5px}
  .cfg-checkbox input{cursor:pointer}
  .cfg-chips{display:flex;flex-wrap:wrap;gap:4px;max-height:140px;overflow-y:auto;padding:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px}
  .cfg-chip{display:flex;align-items:center;gap:4px;padding:3px 6px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:10px;transition:border-color .15s}
  .cfg-chip:hover{border-color:var(--blue)}
  .cfg-chip input{cursor:pointer}
  .cfg-chip-tag{font-size:8px;padding:1px 3px;border-radius:2px;background:var(--bg);color:var(--text3)}
</style>
</head>

<script>
App.init();
function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  html.setAttribute('data-theme', isLight ? 'dark' : 'light');
  localStorage.setItem('theme', isLight ? 'dark' : 'light');
  const moon = document.getElementById('themeIconMoon');
  const sun = document.getElementById('themeIconSun');
  if (moon && sun) { moon.style.display = isLight ? 'none' : 'block'; sun.style.display = isLight ? 'block' : 'none'; }
}
(function() {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  const moon = document.getElementById('themeIconMoon');
  const sun = document.getElementById('themeIconSun');
  if (moon && sun) { moon.style.display = saved === 'light' ? 'none' : 'block'; sun.style.display = saved === 'light' ? 'block' : 'none'; }
})();
const robotId = new URLSearchParams(location.search).get('id');
const connDot = document.getElementById('connDot');
let robotData = null;
let tgFormRendered = false;
let configFormRendered = false;
function getChannels() { try { return JSON.parse(localStorage.getItem('telegram-channels') || '[]'); } catch { return []; } }
function getChannelTopics(channelId) {
  const channels = getChannels();
  const ch = channels.find(c => c.id === channelId);
  return ch?.topics || [];
}
function updateCfgTgTopicOptions() {
  const channelId = document.getElementById('tgChannel').value;
  const topicSel = document.getElementById('tgTopic');
  if (!topicSel) return;
  const topics = channelId ? getChannelTopics(channelId) : [];
  topicSel.innerHTML = '<option value="">Sem topico</option>' +
    topics.map(t => '<option value="' + t.threadId + '">' + t.name + ' (#' + t.threadId + ')</option>').join('');
}
let cfgDestinations = [];
function addCfgDestination() {
  const channelId = document.getElementById('tgChannel').value;
  const threadId = document.getElementById('tgTopic').value;
  const threadIdInt = threadId ? parseInt(threadId) : null;
  if (!channelId) return;
  if (cfgDestinations.find(d => d.channelId === channelId && d.threadId === threadIdInt)) return;
  cfgDestinations.push({ channelId, threadId: threadIdInt });
  renderCfgDestinations();
}
function removeCfgDestination(idx) {
  cfgDestinations.splice(idx, 1);
  renderCfgDestinations();
}
function renderCfgDestinations() {
  const el = document.getElementById('tgDestList');
  if (!el) return;
  if (!cfgDestinations.length) { el.innerHTML = ''; return; }
  el.innerHTML = cfgDestinations.map((d, i) => {
    const ch = getChannels().find(c => c.id === d.channelId);
    const chName = ch?.name || d.channelId;
    const topic = (ch?.topics || []).find(t => t.threadId === d.threadId);
    const topicLabel = topic ? ' > ' + topic.name : (d.threadId ? ' > #' + d.threadId : ' (geral)');
    return '<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg2);border:1px solid var(--border);border-radius:6px;margin-bottom:4px;font-size:12px">' +
      '<span style="flex:1">📢 ' + chName + topicLabel + '</span>' +
      '<button class="btn btn-sm btn-ghost" onclick="removeCfgDestination(' + i + ')" style="font-size:10px;padding:2px 6px;color:var(--red)">X</button></div>';
  }).join('');
}
function updateRoboTopicOptions() {
  updateCfgTgTopicOptions();
}
function getHistory(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; } }
function getEntryMessages() { try { return JSON.parse(localStorage.getItem('telegram-entry-messages-v1') || '{}'); } catch { return {}; } }
function getHistoryStorageKey(game) {
  return game === 'double' ? 'historico-double-v1' : 'historico-wheel-v1';
}
function getHistoryNumber(result) {
  return result?.cellIndex ?? result?.number ?? '';
}
function getHistoryColor(result) {
  const num = result?.number ?? result?.cellIndex;
  if (robotData?.game === 'double') {
    if (num === 0) return 'GREEN';
    if (num >= 1 && num <= 7) return 'RED';
    if (num >= 8 && num <= 14) return 'BLACK';
  }
  const color = String(result?.cellColor ?? result?.color ?? '').toUpperCase();
  if (color === 'GRAY') return 'GREY';
  return color;
}
function getHistoryTime(result) {
  return Number(result?.time || result?.timestamp || 0);
}
function getHistoryRoundKey(result) {
  const roundId = result?.roundId ?? result?.roundID ?? result?.roundUuid ?? result?.roundUUID ?? result?.gameId ?? result?.gameID ?? result?.id ?? result?.uuid;
  return roundId !== undefined && roundId !== null ? String(roundId) : '';
}
function getHistorySignature(result) {
  return [getHistoryNumber(result), getHistoryColor(result), result?.multiplier || ''].join(':');
}
function isImmediateHistoryDuplicate(previous, item) {
  if (!previous || !item) return false;
  const previousRound = getHistoryRoundKey(previous);
  const itemRound = getHistoryRoundKey(item);
  if (previousRound && itemRound) return previousRound === itemRound;
  if (getHistorySignature(previous) !== getHistorySignature(item)) return false;
  const previousTime = getHistoryTime(previous);
  const itemTime = getHistoryTime(item);
  if (!previousTime || !itemTime) return true;
  return Math.abs(previousTime - itemTime) <= 15000;
}
function normalizeDisplayHistory(game, fallbackHistory) {
  const stored = getHistory(getHistoryStorageKey(game));
  let history = stored.length ? stored : (fallbackHistory || []);
  if (game !== 'wheel') return history;
  const cleaned = [];
  history.forEach(item => {
    if (!isImmediateHistoryDuplicate(cleaned[cleaned.length - 1], item)) cleaned.push(item);
  });
  return cleaned;
}
const TARGETS = {
  wheel: [
    { value: 'any', label: 'Qualquer cor' },
    { value: 'grey', label: 'Preto 2X' },
    { value: 'red', label: 'Vermelho 3X' },
    { value: 'blue', label: 'Azul 5X' },
    { value: 'green', label: 'Verde 50X' },
    { value: 'red+grey', label: 'Vermelho / Preto' }
  ],
  double: [
    { value: 'any', label: 'Qualquer cor' },
    { value: 'red', label: 'Vermelho 2X' },
    { value: 'black', label: 'Preto 2X' },
    { value: 'green', label: 'Verde 14X' },
    { value: 'red+black', label: 'Vermelho / Preto' }
  ]
};

EventBus.on('robot:state', (d) => { if (d && d.id === robotId) { robotData = d; renderAll(); renderAnalises(); } });
EventBus.on('robot:log', (d) => { if (d && d.id === robotId) appendLog(d); });
EventBus.on('result:new', (d) => {
  if (robotData && d?.label === robotData.game) renderHistory();
});
EventBus.on('results:history', (d) => {
  if (robotData && d?.label === robotData.game) renderHistory();
});
window.addEventListener('storage', (e) => {
  if (robotData && e.key === getHistoryStorageKey(robotData.game)) renderHistory();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') renderHistory();
});

function appendLog(entry) {
  const el = document.getElementById('consoleLogs');
  if (!el) return;
  const cls = entry.message.includes('ERRO') ? 'log-err' : entry.message.includes('WIN') ? 'log-ok' : entry.message.includes('SINAL') ? 'log-info' : '';
  el.innerHTML = `<div class="log-entry"><span class="log-time">${formatTime(entry.time)}</span> | <span class="${cls}">${escapeHtml(entry.message)}</span></div>` + el.innerHTML;
}

function renderLogs() {
  const el = document.getElementById('consoleLogs');
  if (!el || !robotData) return;
  const logs = robotData.logs || [];
  el.innerHTML = logs.slice(-100).reverse().map(entry => {
    const cls = entry.message.includes('ERRO') ? 'log-err' : entry.message.includes('WIN') ? 'log-ok' : entry.message.includes('SINAL') ? 'log-info' : '';
    return `<div class="log-entry"><span class="log-time">${formatTime(entry.time)}</span> | <span class="${cls}">${escapeHtml(entry.message)}</span></div>`;
  }).join('');
}

function switchConsole() {
  consoleMode = document.getElementById('consoleSource').value;
  document.getElementById('consoleLogs').style.display = consoleMode === 'logs' ? 'block' : 'none';
  document.getElementById('consoleHistory').style.display = 'none';
}

function renderHistory() {
  const el = document.getElementById('historyGrid');
  if (!el || !robotData) return;
  const history = normalizeDisplayHistory(robotData.game, robotData.history);
  if (!history.length) {
    el.innerHTML = '<div style="color:var(--text3);font-size:12px;padding:8px">Aguardando resultados...</div>';
    return;
  }
  const colorMap = {
    RED: { bg: '#ef4444', label: 'V', name: 'Vermelho' },
    BLACK: { bg: '#1f2937', label: 'P', name: 'Preto' },
    GREY: { bg: '#374151', label: 'P', name: 'Preto' },
    GREEN: { bg: '#22c55e', label: 'Vd', name: 'Verde' },
    BLUE: { bg: '#3b82f6', label: 'Az', name: 'Azul' },
    WHITE: { bg: '#e5e7eb', label: 'B', name: 'Branco' }
  };
  const isDbl = robotData.game === 'double';
  const displayed = history.slice(0, 1000);
  el.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:3px">' + displayed.map((r, i) => {
    const color = getHistoryColor(r);
    const c = colorMap[color] || { bg: '#666', label: '?', name: color };
    const num = getHistoryNumber(r);
    const mult = r.multiplier ? ' ' + r.multiplier + 'X' : '';
    const isFirst = i === 0;
    const border = isFirst ? 'border:2px solid #fff;box-shadow:0 0 6px rgba(255,255,255,.3);' : '';
    const size = isDbl ? 'width:28px;height:28px' : 'width:26px;height:26px';
    return '<span title="' + c.name + (num !== '' ? ' #' + num : '') + mult + '" style="display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:9px;font-weight:700;color:#fff;cursor:default;' + size + ';background:' + c.bg + ';' + border + '">' + (num !== '' ? num : c.label) + '</span>';
  }).join('') + '</div>';
}

function renderAll() {
  if (!robotData) return;
  const r = robotData;
  renderAnalises();
  renderEstrategias();
  renderLogs();
  renderHistory();

  const targetColorLabel = { any: 'QUALQUER', red: 'VERMELHO', black: 'PRETO', green: 'VERDE', blue: 'AZUL', grey: 'PRETO', gray: 'PRETO', white: 'BRANCO' };
  const formatColorLabel = color => targetColorLabel[String(color || '').toLowerCase()] || String(color || '--').toUpperCase();
  const targetLabel = formatColorLabel(r.target?.color || 'any');
  document.getElementById('robotHeader').innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="font-size:22px;font-weight:700">${escapeHtml(r.name)}</span> ${createBadge(r.status)}
        <span style="color:var(--text3);font-size:13px">${r.game} | ${r.strategy} | ${r.mode} | Alvo: <strong style="color:var(--green)">${targetLabel}${r.target?.multiplier ? ' ' + r.target.multiplier + 'X' : ''}</strong></span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-shrink:0">
        ${r.status === 'offline'
          ? '<button class="btn btn-sm btn-green" onclick="toggleRobotPower()">▶ Play</button>'
          : '<button class="btn btn-sm btn-red" onclick="toggleRobotPower()">■ Stop</button>'}
        <button class="btn btn-sm btn-ghost" onclick="renameRobot()">Renomear</button>
      </div>
  </div>`;
  document.getElementById('robotStatus').innerHTML = `<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;align-items:center;text-transform:uppercase">
    <span><span style="color:var(--text3)">Status:</span> <strong>${r.status}</strong></span>
    <span><span style="color:var(--text3)">Jogo:</span> <strong>${r.game}</strong></span>
    <span><span style="color:var(--text3)">Est:</span> <strong>${r.strategy}</strong></span>
    <span><span style="color:var(--text3)">Modo:</span> <strong>${r.mode}</strong></span>
    <span><span style="color:var(--text3)">Ult:</span> <strong>${r.lastResult ? (r.lastResult.color || r.lastResult.number) : '--'}</strong></span>
  </div>`;
  const d = r.diagnostic || {};

function renderTelegramPreview(robot) {
  if (!robot) return;
  const r = robot;
  const tgPre = r.telegram || {};
  const tgDestinations = Array.isArray(tgPre.destinations) && tgPre.destinations.length ? tgPre.destinations : (tgPre.channelId ? [{ channelId: tgPre.channelId, threadId: tgPre.threadId || null }] : []);
  const tg = tgPre;
  const firstDest = tgDestinations[0] || {};
  const liveKey = (typeof TelegramService !== 'undefined' && TelegramService.messageKey)
    ? TelegramService.messageKey(r, firstDest)
    : [r.id, firstDest.channelId || ''].join(':');
  const entryKey = (typeof TelegramService !== 'undefined' && TelegramService.entryMessageKey)
    ? TelegramService.entryMessageKey(r, firstDest)
    : liveKey + ':entry';
  const allLiveMessages = (function() { try { return JSON.parse(localStorage.getItem('telegram-live-messages-v1') || '{}'); } catch { return {}; } })();
  const allEntryMessages = getEntryMessages();
  const liveMsg = allLiveMessages[liveKey];
  const entryMsg = allEntryMessages[entryKey] || Object.entries(allEntryMessages).find(([k]) => k.startsWith(r.id + ':'))?.[1] || null;
  const current = r.currentSignal;
  const msgType = document.getElementById('tgMsgType')?.value || tg.msgType || 'both';
  const showLive = ['live', 'both', 'dynamic', 'live_dynamic'].includes(msgType);
  const showEntry = ['signal', 'both', 'normal', 'dynamic', 'live_dynamic'].includes(msgType);
  const lastError = readStoredObject('telegram-last-error-v1');
  let html = '';

  if (showLive) {
    const liveTitle = msgType === 'dynamic' ? 'Mensagem Dinamica' : 'Live (Status do Robo)';
    html += `<div style="padding:10px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
        <div style="font-size:12px;font-weight:700;color:var(--text)">${liveTitle}</div>
        ${liveMsg ? '<span style="font-size:10px;color:var(--green);border:1px solid rgba(41,217,120,.25);border-radius:4px;padding:2px 6px">ENVIADA</span>' : '<span style="font-size:10px;color:var(--text3)">NAO ENVIADA</span>'}
      </div>`;
    if (liveMsg?.text) {
      html += `<pre style="margin:0;white-space:pre-wrap;font:11px/1.4 monospace;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;max-height:180px;overflow:auto">${escapeHtml(liveMsg.text)}</pre>`;
      html += `<div style="font-size:10px;color:var(--text3);margin-top:4px">Message ID: ${liveMsg.messageId || '--'}${liveMsg.updatedAt ? ' | Atualizada: ' + formatTime(liveMsg.updatedAt) : ''}</div>`;
    } else {
      html += `<div style="font-size:11px;color:var(--text3)">Aguardando primeiro resultado para enviar...</div>`;
    }
    html += `</div>`;
  }

  if (showEntry) {
    const entryStatus = current ? (current.status === 'gale_pending' ? 'GALE ' + (current.gale || 1) : 'ENTRADA') : 'SEM ENTRADA';
    const messageStatus = entryMsg?.status ? String(entryMsg.status).toUpperCase() : entryStatus;
    const updatedAt = entryMsg?.updatedAt || entryMsg?.createdAt;
    html += `<div style="padding:10px;background:var(--bg2);border:1px solid var(--border);border-radius:8px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px">
        <div style="font-size:12px;font-weight:700;color:var(--text)">Mensagem de Entrada</div>
        <span style="font-size:10px;color:var(--blue);border:1px solid rgba(41,130,255,.25);border-radius:4px;padding:2px 6px">${escapeHtml(messageStatus)}</span>
      </div>`;
    if (entryMsg?.text) {
      html += `<pre style="margin:0;white-space:pre-wrap;font:11px/1.4 monospace;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;max-height:180px;overflow:auto">${escapeHtml(entryMsg.text)}</pre>`;
      html += `<div style="font-size:10px;color:var(--text3);margin-top:4px">Message ID: ${entryMsg.messageId || '--'}${updatedAt ? ' | Enviada: ' + formatTime(updatedAt) : ''}</div>`;
    } else {
      html += `<div style="font-size:11px;color:var(--yellow)">Nenhuma entrada registrada ainda.</div>`;
    }
    html += `</div>`;
  }

  if (!html) {
    html += `<div style="padding:10px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text3);font-size:11px">Tipo de mensagem "${escapeHtml(msgType)}" sem previa disponivel.</div>`;
  }

  if (lastError?.description) {
    html += `<div style="margin-top:8px;padding:10px;background:rgba(255,74,85,.08);border:1px solid rgba(255,74,85,.28);border-radius:8px">
      <div style="font-size:12px;font-weight:700;color:var(--red)">Ultimo erro Telegram</div>
      <div style="font-size:11px;color:var(--text2);margin-top:4px">${escapeHtml(lastError.context || '--')}: ${escapeHtml(lastError.description)}</div>
      <div style="font-size:10px;color:var(--text3);margin-top:3px">${lastError.at ? 'Horario: ' + formatTime(lastError.at) : ''}</div>
    </div>`;
  }

  const tgPreviewEl = document.getElementById('telegramMessagePreview');
  if (tgPreviewEl) tgPreviewEl.innerHTML = html;
}

function insertAtCursor(textareaId, value) {
  const el = document.getElementById(textareaId);

  const start = el.selectionStart || 0;
  const end = el.selectionEnd || 0;
  el.value = el.value.slice(0, start) + value + el.value.slice(end);
  el.focus();
  const pos = start + value.length;
  el.setSelectionRange(pos, pos);
}

function toggleCfgStrategy(name, checked) {

function toggleCfgIaInteligente() {
  const on = document.getElementById('cfgIaInteligente')?.checked || false;
  if (on) {
    const game = document.getElementById('cfgGame')?.value || 'wheel';
    const target = document.getElementById('cfgTarget')?.value || 'any';

    const wheelByColor = {
      grey: ['cicloPreto','reacaoPreto'],
      red: ['cicloVermelho','convergenciaVermelha'],
      blue: ['cicloAzul','sequenciaAzul'],
      green: ['cicloVerde','convergencia']
    };
    const doubleByColor = {
      black: ['sequenciaNegra','momentumPreto'],
      red: ['sequenciaVermelha','momentumVermelho'],
      green: ['cicloZero','padraoNumerico']
    };

    const map = game === 'wheel' ? wheelByColor : doubleByColor;
    const multiTarget = target.includes('+');
    const isAny = target === 'any';

    document.querySelectorAll('#configForm input[type="checkbox"][id^="cfgStrat_"]').forEach(cb => {
      const tag = cb.closest('.cfg-chip')?.querySelector('.cfg-chip-tag')?.textContent || '';
      const name = cb.id.replace('cfgStrat_', '');

      if (tag === 'GERAL' || tag === 'ADV') { cb.checked = true; return; }

      if (isAny || multiTarget) {
        const allNames = Object.values(map).flat();
        cb.checked = allNames.includes(name);
      } else {
        cb.checked = (map[target] || []).includes(name);
      }
    });
  } else {
    document.querySelectorAll('#configForm input[type="checkbox"][id^="cfgStrat_"]').forEach(cb => {
      const tag = cb.closest('.cfg-chip')?.querySelector('.cfg-chip-tag')?.textContent || '';
      if (tag !== 'GERAL' && tag !== 'ADV') cb.checked = false;
    });
  }
}

async function testTelegramChannel() {

          gale: 0,

          historyResultKey: '',
          createdAt: Date.now(),

function saveConfig() {
  const robot = RobotEngine.getRobot(robotId);
  if (!robot) return;
  const game = document.getElementById('cfgGame')?.value || robot.game;
  const name = document.getElementById('cfgName')?.value || robot.name;
  const strategies = getCfgSelectedStrategies();
  const strategy = strategies.length === 1 ? strategies[0] : 'multi';
  robot.name = name;
  robot.game = game;
  robot.strategy = strategy;
  robot.strategies = strategies;
  robot.minimumConfidence = parseInt(document.getElementById('cfgConf').value) || 80;
  robot.minScore = parseInt(document.getElementById('cfgMinScore')?.value) || 52;
  robot.resultsToAnalyze = parseInt(document.getElementById('cfgResults')?.value) || 500;
  robot.intervalMin = parseInt(document.getElementById('cfgInterval').value) || 60;
  robot.mode = document.getElementById('cfgMode')?.value || 'monitoramento';
  robot.filterMode = document.getElementById('cfgFilterMode')?.value || 'moderado';
  robot.greenProtection = document.getElementById('cfgGreenProt')?.checked || false;
  robot.autoPause = parseInt(document.getElementById('cfgAutoPause')?.value || document.getElementById('cfgAutoPauseColor')?.value) || 0;
  robot.iaInteligente = document.getElementById('cfgIaInteligente')?.checked || false;
  robot.filters = getCfgSelectedFilters();
  const targetColor = document.getElementById('cfgTarget')?.value || 'any';
  const tgOpts = TARGETS[game] || TARGETS.double;
  const targetMult = tgOpts.find(t => t.value === targetColor)?.label.match(/(\d+)X/)?.[1] || null;
  robot.target = { color: targetColor, multiplier: targetMult ? parseInt(targetMult) : null };
  if (typeof robot.normalizeSavedSignalTargets === 'function') robot.normalizeSavedSignalTargets();
  const showGaleByColor = game === 'wheel' && targetColor === 'any';
  if (showGaleByColor) {
    robot.galeByColor = {
      grey: parseInt(document.getElementById('cfgGaleGrey')?.value) || 1,
      red: parseInt(document.getElementById('cfgGaleRed')?.value) || 3,
      blue: parseInt(document.getElementById('cfgGaleBlue')?.value) || 5,
      green: parseInt(document.getElementById('cfgGaleGreen')?.value) || 10
    };
    robot.gale.max = Math.max(robot.galeByColor.grey, robot.galeByColor.red, robot.galeByColor.blue, robot.galeByColor.green);
  } else {
    robot.gale.max = parseInt(document.getElementById('cfgGale')?.value) || 0;
  }
  robot.gale.enabled = robot.gale.max > 0;
  if (tgFormRendered) {
    robot.telegram = {
      enabled: document.getElementById('tgEnabled')?.checked || false,
      destinations: cfgDestinations.length ? cfgDestinations : (document.getElementById('tgChannel')?.value ? [{ channelId: document.getElementById('tgChannel').value, threadId: document.getElementById('tgTopic')?.value ? parseInt(document.getElementById('tgTopic').value) : null }] : []),
      channelId: document.getElementById('tgChannel')?.value || '',
      threadId: document.getElementById('tgTopic')?.value ? parseInt(document.getElementById('tgTopic').value) : null,
      msgType: document.getElementById('tgMsgType')?.value || 'both',
      message: {
        live: document.getElementById('tgMessageLive')?.value || '',
        entry: document.getElementById('tgMessageEntry')?.value || ''
      }
    };
  }
  RobotEngine.save();
  configFormRendered = false;
  tgFormRendered = false;
  loadRobot();
  alert('Configuracao salva');
}

function readStoredObject(key) {
  try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch { return {}; }
}

function writeStoredObject(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

async function deleteStoredTelegramMessage(token, chatId, messageId) {
  if (!token || !chatId || !messageId || typeof TelegramService === 'undefined') return;
  const response = await TelegramService.api(token, 'deleteMessage', { chat_id: chatId, message_id: messageId });
  if (!response.ok && !TelegramService.isAlreadyDeleted(response)) {
    const description = String(response?.description || '').toLowerCase();
    if (!description.includes('message identifier is not specified') && !description.includes('message_id_invalid') && !description.includes('chat not found') && !description.includes('bot was blocked') && !description.includes('user is deactivated') && !description.includes('bad request')) {
      console.warn('[Telegram] deleteMessage/reset', response.description || 'Erro desconhecido');
    }
  }
}

async function resetRobotTelegramMessages(robot) {
  const stores = ['telegram-live-messages-v1', 'telegram-entry-messages-v1'];
  for (const storeKey of stores) {
    const messages = readStoredObject(storeKey);
    const matchingKeys = Object.keys(messages).filter(key => key === robot.id || key.startsWith(robot.id + ':'));
    for (const key of matchingKeys) {
      const msg = messages[key];
      const messageId = msg?.messageId || msg?.message_id;
      const chatId = msg?.chatId || (() => { try { const parts = key.split(':'); return parts[1] || robot.telegram?.channelId || ''; } catch { return robot.telegram?.channelId || ''; } })();
      if (messageId && chatId) {
        const token = TelegramService.getTokenForChat(chatId);
        await deleteStoredTelegramMessage(token, chatId, messageId);
      }
      delete messages[key];
    }
    writeStoredObject(storeKey, messages);
  }

  const events = readStoredObject('telegram-entry-events-v1');
  Object.keys(events).forEach(key => {
    if (key.startsWith(robot.id + '|') || key.startsWith('refresh|' + robot.id + ':')) delete events[key];
  });
  writeStoredObject('telegram-entry-events-v1', events);
}

  const analyses = d.analyses || [];
  
  if (analyses.length === 0) {
    content.innerHTML = '<div style="color:var(--text3);font-size:12px;padding:8px">Nenhuma analise disponivel. Aguardando dados...</div>';
    return;
  }
  
  const typeLabels = {
    sequencia: { icon: '&#9654;', color: 'var(--blue)', name: 'Sequencia' },
    alternado: { icon: '&#8644;', color: 'var(--green)', name: 'Alternado' },
    atrasada: { icon: '&#9200;', color: 'var(--yellow)', name: 'Cor Atrasada' },

    confluencia: { icon: '&#10004;', color: 'var(--green)', name: 'Confluencia' }
  };
  
  const html = analyses.map(a => {
    const info = typeLabels[a.type] || { icon: '&#10003;', color: 'var(--text3)', name: a.type };
    const scoreColor = a.score >= 80 ? 'var(--green)' : a.score >= 60 ? 'var(--yellow)' : 'var(--red)';
    const patternStr = a.pattern ? a.pattern.map(c => {
      const colors = { RED: '&#128308;', BLACK: '&#9899;', GREY: '&#9899;', GREEN: '&#128994;', BLUE: '&#128309;' };
      return `<span style="display:inline-block;width:18px;height:18px;border-radius:4px;background:${c === 'RED' ? '#ef4444' : c === 'GREEN' ? '#22c55e' : c === 'BLUE' ? '#3b82f6' : '#374151'};text-align:center;line-height:18px;font-size:10px;color:white;margin:1px">${colors[c] || c[0]}</span>`;
    }).join('') : '';
    
    return `<div style="padding:10px;margin-bottom:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;border-left:3px solid ${info.color}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:14px;color:${info.color}">${info.icon}</span>
          <span style="font-weight:700;font-size:12px;color:${info.color}">${info.name}</span>
        </div>
        <span style="font-size:14px;font-weight:800;color:${scoreColor}">${a.score}%</span>
      </div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:4px">${escapeHtml(a.detail)}</div>
      ${patternStr ? `<div style="margin-top:6px"><span style="font-size:10px;color:var(--text3)">Padrao:</span> ${patternStr}</div>` : ''}
      ${a.target ? `<div style="margin-top:4px"><span style="font-size:10px;color:var(--text3)">Sugerido:</span> <strong style="color:var(--blue)">${a.target}</strong></div>` : ''}
    </div>`;
  }).join('');
  
  const confluences = analyses.filter(a => a.score >= 60).length;
  
  content.innerHTML = `
    <div style="padding:8px 12px;background:rgba(41,217,120,.08);border:1px solid rgba(41,217,120,.25);border-radius:8px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:12px;color:var(--text2)">Confluencias Detectadas:</span>
      <strong style="font-size:16px;color:${confluences >= 3 ? 'var(--green)' : confluences >= 2 ? 'var(--yellow)' : 'var(--text3)'}">${confluences}</strong>
    </div>
    ${html}
  `;
}

function renderEstrategias() {
  const el = document.getElementById('estrategiasIA');
  if (!robotData) { el.innerHTML = ''; return; }
  const d = robotData.diagnostic || {};
  const details = d.strategyDetails || {};
  const robotStrategies = robotData.strategies || (robotData.strategy ? [robotData.strategy] : []);
  const allNames = Object.keys(details);

  let iaHtml = '';
  if (robotData.iaInteligente) {
    const ia = robotData.iaState || {};
    const activeStrat = ia.activeStrategy || '--';
    const activeTarget = ia.activeTarget || '--';
    const activeMult = ia.activeMultiplier || '--';
    const activeConf = ia.activeConfidence || 0;
    const activeWinRate = ia.activeWinRate || 0;
    const evaluations = ia.evaluations || [];
    const lastAnalysis = ia.lastAnalysisTime ? new Date(ia.lastAnalysisTime).toLocaleTimeString('pt-BR') : '--';
    const colorEmoji = { GREY: '⚫️', RED: '🔴', BLUE: '🔵', GREEN: '🟢', BLACK: '⚫️' };

    iaHtml = `<div style="margin-bottom:12px;padding:10px;background:linear-gradient(135deg,rgba(233,69,96,0.08),rgba(15,52,96,0.08));border:1px solid rgba(233,69,96,0.3);border-radius:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:16px">🧠</span>
        <strong style="color:#e94560;font-size:13px">IA Inteligente - Estrategia Ativa</strong>
        <span style="padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;background:rgba(233,69,96,0.2);color:#e94560">ATIVO</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px">
        <div style="text-align:center;padding:6px;background:var(--bg);border-radius:6px;border:1px solid var(--border)">
          <div style="font-size:9px;color:var(--text3);text-transform:uppercase">Estrategia</div>
          <div style="font-size:12px;font-weight:700;color:var(--text);margin-top:2px">${activeStrat}</div>
        </div>
        <div style="text-align:center;padding:6px;background:var(--bg);border-radius:6px;border:1px solid var(--border)">
          <div style="font-size:9px;color:var(--text3);text-transform:uppercase">Cor</div>
          <div style="font-size:12px;font-weight:700;color:var(--text);margin-top:2px">${colorEmoji[activeTarget] || ''} ${activeTarget}</div>
        </div>
        <div style="text-align:center;padding:6px;background:var(--bg);border-radius:6px;border:1px solid var(--border)">
          <div style="font-size:9px;color:var(--text3);text-transform:uppercase">Multiplicador</div>
          <div style="font-size:12px;font-weight:700;color:#e94560;margin-top:2px">${activeMult}X</div>
        </div>
        <div style="text-align:center;padding:6px;background:var(--bg);border-radius:6px;border:1px solid var(--border)">
          <div style="font-size:9px;color:var(--text3);text-transform:uppercase">Confianca</div>
          <div style="font-size:12px;font-weight:700;color:${activeConf>=70?'var(--green)':activeConf>=50?'var(--yellow)':'var(--red)'};margin-top:2px">${activeConf}%</div>
        </div>
        <div style="text-align:center;padding:6px;background:var(--bg);border-radius:6px;border:1px solid var(--border)">
          <div style="font-size:9px;color:var(--text3);text-transform:uppercase">Win Rate</div>
          <div style="font-size:12px;font-weight:700;color:${activeWinRate>=60?'var(--green)':activeWinRate>=40?'var(--yellow)':'var(--red)'};margin-top:2px">${activeWinRate}%</div>
        </div>
      </div>
      <div style="font-size:10px;color:var(--text3)">Ultima analise: ${lastAnalysis}</div>`;

    if (evaluations.length > 0) {
      iaHtml += `<div style="margin-top:8px;font-size:10px;color:var(--text3);font-weight:600">Top 5 Avaliacoes:</div>
      <div style="margin-top:4px;display:flex;flex-direction:column;gap:3px">
        ${evaluations.slice(0, 5).map((ev, i) => {
          const rank = i + 1;
          const barWidth = Math.max(10, ev.multiplierScore);
          const barColor = rank === 1 ? '#e94560' : rank <= 3 ? 'var(--yellow)' : 'var(--text3)';
          return `<div style="display:flex;align-items:center;gap:6px;font-size:10px">
            <span style="width:14px;text-align:center;font-weight:700;color:${barColor}">${rank}º</span>
            <span style="width:100px;color:var(--text)">${ev.strategy}</span>
            <span style="width:40px;color:var(--text2)">${colorEmoji[ev.targetColor] || ''} ${ev.targetColor}</span>
            <span style="width:30px;color:#e94560;font-weight:700">${ev.multiplier}X</span>
            <div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden">
              <div style="height:100%;width:${barWidth}%;background:${barColor};border-radius:3px"></div>
            </div>
            <span style="width:25px;text-align:right;font-weight:700;color:var(--text)">${ev.multiplierScore}</span>
          </div>`;
        }).join('')}
      </div>`;
    }
    iaHtml += `</div>`;
  }

  const names = allNames.length ? allNames : [];
  if (names.length === 0 && !iaHtml) { el.innerHTML = '<div style="color:var(--text3);font-size:12px;padding:8px">Nenhuma estrategia analisada ainda.</div>'; return; }

  const strategyLabels = {
    alternancia: { icon: '&#8644;', color: 'var(--green)', name: 'Alternancia' },
    repeticao: { icon: '&#8634;', color: 'var(--yellow)', name: 'Repeticao' },
    frequencia: { icon: '&#128200;', color: 'var(--blue)', name: 'Frequencia' },
    tendencia: { icon: '&#128200;', color: 'var(--purple, #a855f7)', name: 'Tendencia' },
    espelhamento: { icon: '&#128256;', color: 'var(--cyan, #06b6d4)', name: 'Espelhamento' },
    diagonal: { icon: '&#9660;', color: 'var(--orange, #f97316)', name: 'Diagonal' },
    padroesCores: { icon: '&#127912;', color: 'var(--red)', name: 'Padroes Cores' }
  };
  const strategyTargets = {
    alternancia: ['RED','BLACK','GREY'],
    repeticao: ['RED','BLACK','GREY'],
    frequencia: ['RED','BLACK','GREY'],
    tendencia: ['RED','BLACK','GREY'],
    espelhamento: ['RED','BLACK','GREY'],
    diagonal: ['RED','BLACK','GREY'],
    padroesCores: ['any','red','black','grey','red+grey','red+black']
  };
  const cfg = robotData.strategyConfig || {};

  const iaActiveStrategy = (robotData.iaInteligente && (robotData.iaState||{}).activeStrategy) || '';

  const html = names.map(name => {
    const info = strategyLabels[name] || { icon: '&#10003;', color: 'var(--text3)', name };
    const s = details[name];
    const conf = s.confidence || 0;
    const confColor = conf >= 80 ? 'var(--green)' : conf >= 60 ? 'var(--yellow)' : conf >= 30 ? 'var(--orange, #f97316)' : 'var(--red)';
    const sc = cfg[name] || {};
    const enabled = sc.enabled !== false;
    const minConf = sc.minConfidence || 0;
    const target = sc.target || 'any';
    const isIASelected = iaActiveStrategy === name;
    const defaultPS = { alternancia: 5, repeticao: 5, frequencia: 1, tendencia: 5, espelhamento: 5, diagonal: 6, padroesCores: 3 };
    const ps = sc.patternSize || defaultPS[name] || 3;
    const statusBadge = s.matched
      ? '<span style="padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;background:rgba(41,217,120,.15);color:var(--green)">OK</span>'
      : '<span style="padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;background:rgba(255,68,68,.1);color:var(--red)">--</span>';
    const tgtOpts = (strategyTargets[name] || strategyTargets.alternancia).map(t => `<option value="${t}" ${target===t?'selected':''}>${t.toUpperCase()}</option>`).join('');

    const pSizeBtn = `<div style="display:flex;align-items:center;gap:2px;margin-left:6px" title="Tamanho do padrao">
      <button onclick="changePatternSize('${name}',-1)" style="width:18px;height:18px;border-radius:3px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">-</button>
      <span style="font-size:10px;font-weight:700;color:var(--text);min-width:14px;text-align:center">${ps}</span>
      <button onclick="changePatternSize('${name}',1)" style="width:18px;height:18px;border-radius:3px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">+</button>
    </div>`;
    return `<div style="padding:6px 10px;margin-bottom:4px;background:${isIASelected?'linear-gradient(135deg,rgba(233,69,96,0.06),rgba(15,52,96,0.06))':'var(--bg2)'};border:1px solid ${isIASelected?'rgba(233,69,96,0.4)':enabled?confColor:'var(--border)'};border-radius:6px;opacity:${enabled?1:.5}">
      <div style="display:flex;align-items:center;gap:6px;font-size:12px">
        <input type="checkbox" ${enabled?'checked':''} onchange="toggleStrategy('${name}',this.checked)" style="cursor:pointer" title="Ativar/Desativar">
        <span style="color:${info.color};font-size:13px">${info.icon}</span>
        <span style="font-weight:700;min-width:80px;color:${info.color}">${info.name}</span>
        ${isIASelected ? '<span style="padding:1px 5px;border-radius:3px;font-size:8px;font-weight:700;background:rgba(233,69,96,0.2);color:#e94560">IA</span>' : ''}
        ${pSizeBtn}
        ${statusBadge}
        <span style="font-size:16px;font-weight:800;color:${confColor};min-width:36px;text-align:right">${conf}%</span>
        <div style="margin-left:auto;display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text3)">
          <span>Min:</span>
          <input type="number" value="${minConf}" min="0" max="100" style="width:40px;padding:2px 4px;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:11px;text-align:center" onchange="updateStrategyConfig('${name}','minConfidence',+this.value)">
          <span>%</span>
          <select style="padding:2px 4px;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:11px" onchange="updateStrategyConfig('${name}','target',this.value)">${tgtOpts}</select>
        </div>
      </div>
      ${s.reason ? `<div style="font-size:10px;color:var(--text3);margin-top:3px;padding-left:20px">${escapeHtml(s.reason)}</div>` : ''}
      ${s.pattern && s.pattern.length > 0 ? `<div style="margin-top:4px;padding-left:20px;display:flex;align-items:center;gap:4px;flex-wrap:wrap">${s.pattern.map(c => {
        const bg = c === 'RED' ? '#ef4444' : c === 'GREEN' ? '#22c55e' : c === 'BLUE' ? '#3b82f6' : c === 'GREY' || c === 'BLACK' ? '#374151' : '#666';
        const label = c === 'RED' ? 'V' : c === 'BLACK' ? 'P' : c === 'GREY' ? 'P' : c === 'GREEN' ? 'Vd' : c === 'BLUE' ? 'Az' : '?';
        return `<span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;background:${bg};font-size:9px;font-weight:700;color:white">${label}</span>`;
      }).join('<span style="color:var(--text3);font-size:9px">&rarr;</span>')}</div>` : ''}
    </div>`;
  }).join('');

  el.innerHTML = iaHtml + html;
}

function changePatternSize(name, delta) {
  if (!robotData) return;
  if (!robotData.strategyConfig) robotData.strategyConfig = {};
  if (!robotData.strategyConfig[name]) robotData.strategyConfig[name] = {};
  const defaultPS = { alternancia: 5, repeticao: 5, frequencia: 1, tendencia: 5, espelhamento: 5, diagonal: 6, padroesCores: 3 };
  let sz = (robotData.strategyConfig[name].patternSize || defaultPS[name] || 3) + delta;
  if (sz < 1) sz = 1;
  if (sz > 6) sz = 6;
  robotData.strategyConfig[name].patternSize = sz;
  if (name === 'padroesCores') robotData.patternSize = sz;
  const robot = RobotEngine.getRobot(robotData.id);
  if (robot) {
    robot.strategyConfig = robotData.strategyConfig;
    if (name === 'padroesCores') robot.patternSize = sz;
    robot.analyze();
    robotData = robot.getState();
    RobotEngine.save();
  }
  renderAll();
  renderAnalises();
}

function toggleStrategy(name, enabled) {
  if (!robotData) return;
  if (!robotData.strategyConfig) robotData.strategyConfig = {};
  if (!robotData.strategyConfig[name]) robotData.strategyConfig[name] = {};
  robotData.strategyConfig[name].enabled = enabled;
  const robot = RobotEngine.getRobot(robotData.id);
  if (robot) { robot.strategyConfig = robotData.strategyConfig; RobotEngine.save(); }
}

function updateStrategyConfig(name, key, value) {
  if (!robotData) return;
  if (!robotData.strategyConfig) robotData.strategyConfig = {};
  if (!robotData.strategyConfig[name]) robotData.strategyConfig[name] = {};
  robotData.strategyConfig[name][key] = value;
  const robot = RobotEngine.getRobot(robotData.id);
  if (robot) { robot.strategyConfig = robotData.strategyConfig; RobotEngine.save(); }
}

loadRobot();
renderConnectionStatus();
setInterval(loadRobot, 5000);
setInterval(renderConnectionStatus, 2000);
</script>

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js').catch(() => {});
}
