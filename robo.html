<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Robo - Sistema</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="robo.css">
<style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}</style>
</head>
<body>
<nav class="nav">
  <span class="nav-brand">ROBOS</span>
  <div class="nav-links"><a href="index.html">Dashboard</a><a href="monitoramento.html">Monitoramento</a><a href="robos.html">Robos</a><a href="analise.html">Analise</a></div>
  <div class="nav-status"><a href="ws-background.html" target="_blank" style="font-size:11px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;color:var(--text3);margin-right:8px">BG</a><div class="dot" id="connDot"></div></div>
</nav>
<div class="container">
  <div id="robotHeader" style="margin-bottom:16px"></div>
  <div class="robo-page">
    <div>
      <div class="robo-section"><div class="robo-section-title">Status do Robo</div><div id="robotStatus"></div></div>
      <div class="robo-section" style="margin-top:16px"><div class="robo-section-title">Diagnostico da IA</div><div id="diagnostico" style="max-height:350px;overflow-y:auto"></div></div>
      <div class="robo-section" style="margin-top:16px"><div class="robo-section-title">Estrategias da IA</div><div id="estrategiasIA" style="max-height:none;overflow:visible"></div></div>
      <div class="robo-section" style="margin-top:16px;display:none" id="analisesSection"><div class="robo-section-title">Analises Padroes Cores</div><div id="analisesContent" style="max-height:300px;overflow-y:auto"></div></div>
      <div class="robo-section" style="margin-top:16px"><div class="robo-section-title">Filtro de Sinal</div><div id="filtro"></div></div>
      <div class="robo-section" style="margin-top:16px"><div class="robo-section-title">Placar e Estatisticas</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px" id="placar"></div></div>
    </div>
    <div>
      <div class="robo-section"><div class="robo-section-title">Historico</div><div id="historyGrid" style="max-height:500px;overflow-y:auto"></div></div>
      <div class="robo-section" style="margin-top:16px">
        <div class="robo-section-title" style="display:flex;align-items:center;justify-content:space-between">
          <span>Console em Tempo Real</span>
          <select id="consoleSource" onchange="switchConsole()" style="padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:11px">
            <option value="logs">Logs do Robo</option>
          </select>
        </div>
        <div id="consoleLogs" class="robo-console"></div>
        <div id="consoleHistory" style="display:none"></div>
      </div>
      <div class="robo-section" style="margin-top:16px"><div class="robo-section-title">Configuracao</div><div class="config-form" id="configForm"></div></div>
      <div class="robo-section" style="margin-top:16px">
        <div class="robo-section-title">Telegram</div>
        <div id="telegramConfig"></div>
        <div id="telegramMessagePreview" style="margin-top:12px"></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px"><button class="btn btn-green" onclick="saveConfig()">Salvar</button><button class="btn btn-red" onclick="resetRobot()">Resetar</button><button class="btn btn-yellow" onclick="resetPatterns()">Resetar Padroes</button></div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script src="saved-data.js"></script>
<script src="store.js"></script>
<script src="event-bus.js"></script>
<script src="utils.js"></script>
<script src="ws-source.js"></script>
<script src="robot.js"></script>
<script src="robot-engine.js"></script>
<script src="telegram.js"></script>
<script src="app.js"></script>
<script>
App.init();
const robotId = new URLSearchParams(location.search).get('id');
const connDot = document.getElementById('connDot');
let robotData = null;
let tgFormRendered = false;
let configFormRendered = false;
function getChannels() { try { return JSON.parse(localStorage.getItem('telegram-channels') || '[]'); } catch { return []; } }
function getHistory(key) { try { return JSON.parse(localStorage.getItem(key) || '[]'); } catch { return []; } }
function getEntryMessages() { try { return JSON.parse(localStorage.getItem('telegram-entry-messages-v1') || '{}'); } catch { return {}; } }
const TARGETS = {
  wheel: [
    { value: 'any', label: 'Qualquer cor' },
    { value: 'grey', label: 'Preto 2X' },
    { value: 'red', label: 'Vermelho 3X' },
    { value: 'blue', label: 'Azul 5X' },
    { value: 'green', label: 'Verde 50X' }
  ],
  double: [
    { value: 'any', label: 'Qualquer cor' },
    { value: 'red', label: 'Vermelho 2X' },
    { value: 'black', label: 'Preto 2X' },
    { value: 'green', label: 'Verde 14X' }
  ]
};

EventBus.on('robot:state', (d) => { if (d && d.id === robotId) { robotData = d; renderAll(); renderAnalises(); } });
EventBus.on('robot:log', (d) => { if (d && d.id === robotId) appendLog(d); });

function appendLog(entry) {
  const el = document.getElementById('consoleLogs');
  if (!el) return;
  const cls = entry.message.includes('ERRO') ? 'log-err' : entry.message.includes('WIN') ? 'log-ok' : entry.message.includes('SINAL') ? 'log-info' : '';
  el.innerHTML = `<div class="log-entry"><span class="log-time">${formatTime(entry.time)}</span> | <span class="${cls}">${escapeHtml(entry.message)}</span></div>` + el.innerHTML;
}

function renderLogs() {
  const el = document.getElementById('consoleLogs');
  if (!el || !robotData) return;
  const logs = robotData.logs || [];
  el.innerHTML = logs.slice(-100).reverse().map(entry => {
    const cls = entry.message.includes('ERRO') ? 'log-err' : entry.message.includes('WIN') ? 'log-ok' : entry.message.includes('SINAL') ? 'log-info' : '';
    return `<div class="log-entry"><span class="log-time">${formatTime(entry.time)}</span> | <span class="${cls}">${escapeHtml(entry.message)}</span></div>`;
  }).join('');
}

function switchConsole() {
  consoleMode = document.getElementById('consoleSource').value;
  document.getElementById('consoleLogs').style.display = consoleMode === 'logs' ? 'block' : 'none';
  document.getElementById('consoleHistory').style.display = 'none';
}

function renderAll() {
  if (!robotData) return;
  const r = robotData;
  renderAnalises();
  renderEstrategias();
  renderLogs();

  const targetColorLabel = { any: 'QUALQUER', red: 'VERMELHO', black: 'PRETO', green: 'VERDE', blue: 'AZUL', grey: 'PRETO', gray: 'PRETO', white: 'BRANCO' };
  const formatColorLabel = color => targetColorLabel[String(color || '').toLowerCase()] || String(color || '--').toUpperCase();
  const targetLabel = formatColorLabel(r.target?.color || 'any');
  document.getElementById('robotHeader').innerHTML = `<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
    <div>
      <h1 style="font-size:22px">${escapeHtml(r.name)} ${createBadge(r.status)}</h1>
      <p style="color:var(--text3);font-size:13px">${r.game} | ${r.strategy} | ${r.mode} | Alvo: <strong style="color:var(--green)">${targetLabel}${r.target?.multiplier ? ' ' + r.target.multiplier + 'X' : ''}</strong></p>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
      ${r.status === 'offline'
        ? '<button class="btn btn-sm btn-green" onclick="toggleRobotPower()">▶ Play</button>'
        : '<button class="btn btn-sm btn-red" onclick="toggleRobotPower()">■ Stop</button>'}
      <button class="btn btn-sm btn-ghost" onclick="renameRobot()">Renomear</button>
    </div>
  </div>`;
  document.getElementById('robotStatus').innerHTML = `<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;align-items:center;text-transform:uppercase">
    <span><span style="color:var(--text3)">Status:</span> <strong>${r.status}</strong></span>
    <span><span style="color:var(--text3)">Jogo:</span> <strong>${r.game}</strong></span>
    <span><span style="color:var(--text3)">Est:</span> <strong>${r.strategy}</strong></span>
    <span><span style="color:var(--text3)">Modo:</span> <strong>${r.mode}</strong></span>
    <span><span style="color:var(--text3)">Ult:</span> <strong>${r.lastResult ? (r.lastResult.color || r.lastResult.number) : '--'}</strong></span>
  </div>`;
  const d = r.diagnostic || {};
  const suggestedEntryLabel = d.suggestedEntry ? formatColorLabel(d.suggestedEntry) : '--';
  const decisionTargetLabel = d.decision?.target ? formatColorLabel(d.decision.target) : '--';
  const entrySendState = getEntrySendState(r);
  const diagStatus = d.status || 'IDLE';
  const diagColor = diagStatus === 'ACTIVE' ? 'var(--green)' : diagStatus === 'ANALYZING' ? 'var(--yellow)' : diagStatus === 'LOADING' ? 'var(--blue)' : 'var(--text3)';
  const diagBg = diagStatus === 'ACTIVE' ? 'rgba(41,217,120,.08)' : diagStatus === 'ANALYZING' ? 'rgba(224,197,64,.08)' : diagStatus === 'LOADING' ? 'rgba(35,104,255,.08)' : 'transparent';
  document.getElementById('diagnostico').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:${diagBg};border:1px solid ${diagColor};border-radius:6px;margin-bottom:8px">
      <div style="width:8px;height:8px;border-radius:50%;background:${diagColor};animation:${diagStatus==='ACTIVE'?'pulse 1.5s infinite':diagStatus==='LOADING'?'pulse 1s infinite':'none'}"></div>
      <span style="font-size:11px;font-weight:700;color:${diagColor}">${diagStatus}</span>
      <span style="font-size:10px;color:var(--text3)">${d.analyzedResults || 0} res.</span>
      <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
        <span style="font-size:10px;color:var(--text3)">Score:</span>
        <span style="font-size:13px;font-weight:800;color:var(--text)">${d.totalScore || 0}</span>
        <span style="font-size:10px;color:var(--text3)">Conf:</span>
        <span style="font-size:15px;font-weight:800;color:${(d.confidence||0)>=80?'var(--green)':(d.confidence||0)>=60?'var(--yellow)':'var(--red)'}">${d.confidence || 0}%</span>
      </div>
    </div>
    <div style="display:flex;gap:12px;font-size:11px;margin-bottom:6px;flex-wrap:wrap">
      <span><span style="color:var(--text3)">Pad:</span> <strong>${d.mainPattern || '--'}</strong></span>
      <span><span style="color:var(--text3)">Entrada:</span> <strong style="color:var(--blue)">${suggestedEntryLabel}</strong></span>
      <span><span style="color:var(--text3)">Conf:</span> <strong>${d.confluences || 0}</strong></span>
      <span><span style="color:var(--text3)">Risco:</span> <strong style="color:${(d.risk||'BAIXO')==='ALTO'?'var(--red)':(d.risk||'BAIXO')==='MEDIO'?'var(--yellow)':'var(--green)'}">${d.risk || 'BAIXO'}</strong></span>
      <span><span style="color:var(--text3)">Sinal:</span> <strong>${d.signalScore || 0}/100</strong></span>
    </div>
    <div class="pattern-list" style="margin-bottom:4px">${Object.entries(d.patternScores || {}).map(([k,v]) => `<div class="pattern-item"><span>${k}</span><div class="pattern-bar"><div class="pattern-bar-fill" style="width:${v}%;background:${v>=80?'var(--green)':v>=60?'var(--yellow)':'var(--red)'}"></div></div><span>${v}%</span></div>`).join('')}</div>
    ${d.decision ? `<div style="padding:4px 8px;border-radius:4px;font-size:11px;margin-bottom:6px;background:${d.decision.approved?'rgba(41,217,120,.1)':'rgba(255,68,68,.1)'};border:1px solid ${d.decision.approved?'rgba(41,217,120,.3)':'rgba(255,68,68,.3)'};color:${d.decision.approved?'var(--green)':'var(--red)'}">${d.decision.approved?'SINAL APROVADO':'REJEITADO'}: ${d.decision.reason||''}</div>` : ''}
    ${Object.keys(r.usedPatterns||{}).some(k => r.usedPatterns[k]?.length > 0) ? `<div style="font-size:9px;color:var(--text3);padding:4px 8px;background:var(--bg2);border:1px solid var(--border);border-radius:4px">Ciclo: ${r.strategyIndex || 0}/6 | Usados: ${Object.entries(r.usedPatterns||{}).filter(([k,v]) => v?.length > 0).map(([k,v]) => `${k}:${v.length}`).join(' ')}</div>` : ''}`;
  const s = r.stats || {};
  const histKey = r.game === 'double' ? 'historico-double-v1' : 'historico-wheel-v1';
  const histData = getHistory(histKey);
  const isDbl = r.game === 'double';
  document.getElementById('filtro').innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:10px">
      <div style="padding:4px 6px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;text-align:center">
        <div style="color:var(--text3);font-size:9px">1. Padrao</div>
        <div style="font-weight:700;color:${d.mainPattern?'var(--green)':'var(--text3)'};font-size:11px">${d.mainPattern ? '&#10003;' : '...'}</div>
      </div>
      <div style="padding:4px 6px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;text-align:center">
        <div style="color:var(--text3);font-size:9px">2. IA</div>
        <div style="font-weight:700;color:${d.confidence>=60?'var(--green)':'var(--text3)'};font-size:11px">${d.confidence || 0}%</div>
      </div>
      <div style="padding:4px 6px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;text-align:center">
        <div style="color:var(--text3);font-size:9px">3. Filtro</div>
        <div style="font-weight:700;color:${d.decision?.approved?'var(--green)':d.decision?'var(--red)':'var(--text3)'};font-size:11px">${d.decision?.approved?'OK':d.decision?'X':'...'}</div>
      </div>
      <div style="padding:4px 6px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;text-align:center">
        <div style="color:var(--text3);font-size:9px">4. Entrada</div>
        <div style="font-weight:700;color:var(--blue);font-size:11px">${decisionTargetLabel !== '--' ? decisionTargetLabel : '...'}</div>
      </div>
      <div style="padding:4px 6px;background:var(--bg2);border:1px solid var(--border);border-radius:4px;text-align:center">
        <div style="color:var(--text3);font-size:9px">5. Placar</div>
        <div style="font-weight:700;font-size:11px">${s.wins||0}W ${s.losses||0}L</div>
      </div>
    </div>`;
  document.getElementById('placar').innerHTML = [['Sinais',s.signals||0,'blue'],['Wins',s.wins||0,'green'],['Loss',s.losses||0,'red'],['Assertividade',(s.signals||0)>0?Math.round(((s.wins||0)/s.signals)*100)+'%':'--%','blue']].map(([l,v,c])=>`<div class="stat-card ${c}"><div class="stat-label">${l}</div><div class="stat-value">${v}</div></div>`).join('');
  if (!configFormRendered) {
    const tgOpts = (TARGETS[r.game] || TARGETS.double).map(t => `<option value="${t.value}" ${r.target?.color === t.value ? 'selected' : ''}>${t.label}</option>`).join('');
    document.getElementById('configForm').innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        <div><label style="font-size:10px;color:var(--text3);display:block;margin-bottom:2px">Estrategia</label>
          <select id="cfgStrategy" style="width:100%;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px" onchange="document.getElementById('cfgPatternSizeGroup').style.display=this.value==='padroesCores'?'block':'none'">
            <option value="todas" ${r.strategy==='todas'?'selected':''}>Todas</option>
            <option value="alternancia" ${r.strategy==='alternancia'?'selected':''}>Alternancia</option>
            <option value="repeticao" ${r.strategy==='repeticao'?'selected':''}>Repeticao</option>
            <option value="frequencia" ${r.strategy==='frequencia'?'selected':''}>Frequencia</option>
            <option value="tendencia" ${r.strategy==='tendencia'?'selected':''}>Tendencia</option>
            <option value="espelhamento" ${r.strategy==='espelhamento'?'selected':''}>Espelhamento</option>
            <option value="diagonal" ${r.strategy==='diagonal'?'selected':''}>Diagonal</option>
            <option value="padroesCores" ${r.strategy==='padroesCores'?'selected':''}>Padroes Cores</option>
          </select>
        </div>
        <div id="cfgPatternSizeGroup" style="display:${r.strategy==='padroesCores'?'block':'none'}"><label style="font-size:10px;color:var(--text3);display:block;margin-bottom:2px">Tam Padrao</label>
          <select id="cfgPatternSize" style="width:100%;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px">
            ${[1,2,3,4,5,6].map(n => `<option value="${n}" ${(r.patternSize||3)===n?'selected':''}>${n} cor${n>1?'es':''}</option>`).join('')}
          </select>
        </div>
        <div><label style="font-size:10px;color:var(--text3);display:block;margin-bottom:2px">Alvo</label><select id="cfgTarget" style="width:100%;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px">${tgOpts}</select></div>
        <div><label style="font-size:10px;color:var(--text3);display:block;margin-bottom:2px">Filtro</label>
          <select id="cfgFilterMode" style="width:100%;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px">
            <option value="desligado" ${r.filterMode==='desligado'?'selected':''}>Desligado</option>
            <option value="conservador" ${r.filterMode==='conservador'?'selected':''}>Conservador</option>
            <option value="moderado" ${r.filterMode==='moderado'||!r.filterMode?'selected':''}>Moderado</option>
            <option value="agressivo" ${r.filterMode==='agressivo'?'selected':''}>Agressivo</option>
          </select>
        </div>
        <div><label style="font-size:10px;color:var(--text3);display:block;margin-bottom:2px">Conf Min</label><input id="cfgConf" type="number" value="${r.minimumConfidence||80}" style="width:100%;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px"></div>
        <div><label style="font-size:10px;color:var(--text3);display:block;margin-bottom:2px">Intervalo(s)</label><input id="cfgInterval" type="number" value="${r.intervalMin||60}" style="width:100%;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px"></div>
        <div><label style="font-size:10px;color:var(--text3);display:block;margin-bottom:2px">Gale Max</label><input id="cfgGale" type="number" value="${r.gale?.max||0}" style="width:100%;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px"></div>
      </div>`;
    configFormRendered = true;
  }

  if (!tgFormRendered) {
    const channels = getChannels();
    const tg = r.telegram || { enabled: false, channelId: '' };
    const tgMessage = tg.message || {};
    document.getElementById('telegramConfig').innerHTML = `
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer">
          <input type="checkbox" id="tgEnabled" ${tg.enabled ? 'checked' : ''}> Telegram
        </label>
        <select id="tgChannel" style="padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:11px;min-width:140px">
          <option value="">Canal...</option>
          ${channels.map(c => `<option value="${c.id}" ${tg.channelId === c.id ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
        </select>
        <select id="tgMsgType" style="padding:4px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:11px">
          <option value="live" ${tg.msgType === 'live' ? 'selected' : ''}>Live</option>
          <option value="signal" ${tg.msgType === 'signal' ? 'selected' : ''}>Sinal</option>
          <option value="both" ${tg.msgType === 'both' || !tg.msgType ? 'selected' : ''}>Live+Sinal</option>
        </select>
        <button class="btn btn-sm btn-blue" onclick="testTelegramChannel()" id="btnTestTg">Testar</button>
        <span id="testTgResult" style="font-size:10px"></span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
            <span style="font-size:10px;color:var(--text3)">Msg Live</span>
            <button type="button" class="btn btn-sm btn-ghost" onclick="insertLiveVars()" style="font-size:9px;padding:1px 4px">+var</button>
          </div>
          <textarea id="tgMessageLive" rows="3" style="width:100%;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:11px;font-family:monospace;resize:vertical" placeholder="Padrao. Use {variaveis}.">${escapeHtml(tgMessage.live || '')}</textarea>
        </div>
        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
            <span style="font-size:10px;color:var(--text3)">Msg Sinal</span>
            <button type="button" class="btn btn-sm btn-ghost" onclick="insertEntryVars()" style="font-size:9px;padding:1px 4px">+var</button>
          </div>
          <textarea id="tgMessageEntry" rows="3" style="width:100%;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:11px;font-family:monospace;resize:vertical" placeholder="Padrao. Use {variaveis}.">${escapeHtml(tgMessage.entry || '')}</textarea>
        </div>
      </div>
      <div style="font-size:9px;color:var(--text3);margin-top:4px">Live: {robotName} {game} {strategy} {status} {lastResult} {history} {wins} {losses} {rate} | Sinal: {target} {confidence} {gale} {historyEmojis}</div>
      <div style="font-size:9px;color:var(--text3);margin-top:2px">Canais em Configuracoes > Canais / Grupos</div>`;
    tgFormRendered = true;
  }
  renderTelegramMessagePreview(r);
  document.getElementById('historyGrid').innerHTML = histData.length
    ? `<div class="history-grid">${histData.map(h => {
        const color = isDbl ? h.color : h.cellColor;
        const num = isDbl ? h.number : h.cellIndex;
        const mult = !isDbl && h.multiplier ? h.multiplier + 'X' : '';
        return `<div class="history-cell ${(color||'').toLowerCase()}">${mult || num || ''}</div>`;
      }).join('')}</div>`
    : '<div style="color:var(--text3);font-size:12px;padding:8px">Nenhum resultado. Abra ws-background.html</div>';
}

function getEntrySendState(r) {
  const tg = r.telegram || {};
  const current = r.currentSignal || null;
  const message = tg.channelId ? getEntryMessages()[[r.id, tg.channelId, 'entry'].join(':')] : null;
  const messageStatus = String(message?.status || '').toLowerCase();
  const currentStatus = String(current?.status || '').toLowerCase();
  const sameSignal = !!(current && message?.signalId === current.id);

  if (!tg.enabled || !tg.channelId) {
    return { badge: 'LOCAL', badgeClass: 'sf-badge-ok', color: 'var(--yellow)', label: 'Entrada gerada no robo', detail: 'Telegram desligado ou sem canal', messageId: '' };
  }

  if (sameSignal && currentStatus === 'approved' && messageStatus === 'approved') {
    return { badge: 'ENVIADA', badgeClass: 'sf-badge-pass', color: 'var(--green)', label: 'Entrada enviada', detail: 'Mensagem atualizada no Telegram', messageId: message.messageId || '' };
  }

  if (sameSignal && currentStatus === 'gale_pending' && messageStatus === 'gale_pending') {
    return { badge: 'GALE', badgeClass: 'sf-badge-ok', color: 'var(--yellow)', label: 'Gale em andamento', detail: 'Mensagem editada para G' + (current.gale || 1), messageId: message.messageId || '' };
  }

  if (!current && (messageStatus === 'win' || messageStatus === 'loss')) {
    return { badge: messageStatus.toUpperCase(), badgeClass: messageStatus === 'win' ? 'sf-badge-pass' : 'sf-badge-fail', color: messageStatus === 'win' ? 'var(--green)' : 'var(--red)', label: 'Resultado final enviado', detail: 'Historico atualiza a cada nova cor ate surgir outra entrada', messageId: message.messageId || '' };
  }

  if (current && message && message.signalId !== current.id && (messageStatus === 'win' || messageStatus === 'loss')) {
    return { badge: 'LIMPAR', badgeClass: 'sf-badge-ok', color: 'var(--yellow)', label: 'Preparando nova entrada', detail: 'Resultado anterior sera excluido antes do novo envio', messageId: message.messageId || '' };
  }

  if (current) {
    return { badge: 'PENDENTE', badgeClass: 'sf-badge-ok', color: 'var(--yellow)', label: 'Entrada gerada', detail: 'Aguardando registro da mensagem no Telegram', messageId: message?.messageId || '' };
  }

  return { badge: 'PRONTO', badgeClass: 'sf-badge-ok', color: 'var(--text3)', label: 'Aguardando nova entrada', detail: 'Sem sinal ativo no momento', messageId: message?.messageId || '' };
}

function findEntryMessage(robotId) {
  const all = getEntryMessages();
  const exactKey = Object.keys(all).find(k => k.startsWith(robotId + ':') && k.endsWith(':entry'));
  if (exactKey) return all[exactKey];
  const looseKey = Object.keys(all).find(k => k.startsWith(robotId + ':'));
  return looseKey ? all[looseKey] : null;
}

function readStoredObject(key) {
  try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch { return {}; }
}

function writeStoredObject(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

async function deleteStoredTelegramMessage(token, chatId, messageId) {
  if (!token || !chatId || !messageId || typeof TelegramService === 'undefined') return;
  const response = await TelegramService.api(token, 'deleteMessage', { chat_id: chatId, message_id: messageId });
  if (!response.ok && !TelegramService.isAlreadyDeleted(response)) {
    const description = String(response?.description || '').toLowerCase();
    if (!description.includes('message identifier is not specified') && !description.includes('message_id_invalid') && !description.includes('chat not found') && !description.includes('bot was blocked') && !description.includes('user is deactivated') && !description.includes('bad request')) {
      console.warn('[Telegram] deleteMessage/reset', response.description || 'Erro desconhecido');
    }
  }
}

async function resetRobotTelegramMessages(robot) {
  const token = localStorage.getItem('telegram-bot-token') || '';
  const stores = ['telegram-live-messages-v1', 'telegram-entry-messages-v1'];
  for (const storeKey of stores) {
    const messages = readStoredObject(storeKey);
    const matchingKeys = Object.keys(messages).filter(key => key === robot.id || key.startsWith(robot.id + ':'));
    for (const key of matchingKeys) {
      const msg = messages[key];
      const messageId = msg?.messageId || msg?.message_id;
      const chatId = msg?.chatId || (() => { try { const parts = key.split(':'); return parts[1] || robot.telegram?.channelId || ''; } catch { return robot.telegram?.channelId || ''; } })();
      if (messageId && chatId) {
        await deleteStoredTelegramMessage(token, chatId, messageId);
      }
      delete messages[key];
    }
    writeStoredObject(storeKey, messages);
  }

  const events = readStoredObject('telegram-entry-events-v1');
  Object.keys(events).forEach(key => {
    if (key.startsWith(robot.id + '|') || key.startsWith('refresh|' + robot.id + ':')) delete events[key];
  });
  writeStoredObject('telegram-entry-events-v1', events);
}

    const conf = s.confidence || 0;
    const confColor = conf >= 80 ? 'var(--green)' : conf >= 60 ? 'var(--yellow)' : conf >= 30 ? 'var(--orange, #f97316)' : 'var(--red)';
    const sc = cfg[name] || {};
    const enabled = sc.enabled !== false;
    const minConf = sc.minConfidence || 0;
    const target = sc.target || 'any';
    const defaultPS = { alternancia: 5, repeticao: 5, frequencia: 1, tendencia: 5, espelhamento: 5, diagonal: 6, padroesCores: 3 };
    const ps = sc.patternSize || defaultPS[name] || 3;
    const statusBadge = s.matched
      ? '<span style="padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;background:rgba(41,217,120,.15);color:var(--green)">OK</span>'
      : '<span style="padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;background:rgba(255,68,68,.1);color:var(--red)">--</span>';
    const tgtOpts = (strategyTargets[name] || strategyTargets.alternancia).map(t => `<option value="${t}" ${target===t?'selected':''}>${t.toUpperCase()}</option>`).join('');

    const pSizeBtn = `<div style="display:flex;align-items:center;gap:2px;margin-left:6px" title="Tamanho do padrao">
      <button onclick="changePatternSize('${name}',-1)" style="width:18px;height:18px;border-radius:3px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">-</button>
      <span style="font-size:10px;font-weight:700;color:var(--text);min-width:14px;text-align:center">${ps}</span>
      <button onclick="changePatternSize('${name}',1)" style="width:18px;height:18px;border-radius:3px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">+</button>
    </div>`;
    return `<div style="padding:6px 10px;margin-bottom:4px;background:var(--bg2);border:1px solid ${enabled?confColor:'var(--border)'};border-radius:6px;opacity:${enabled?1:.5}">
      <div style="display:flex;align-items:center;gap:6px;font-size:12px">
        <input type="checkbox" ${enabled?'checked':''} onchange="toggleStrategy('${name}',this.checked)" style="cursor:pointer" title="Ativar/Desativar">
        <span style="color:${info.color};font-size:13px">${info.icon}</span>
        <span style="font-weight:700;min-width:80px;color:${info.color}">${info.name}</span>
        ${pSizeBtn}
        ${statusBadge}
        <span style="font-size:16px;font-weight:800;color:${confColor};min-width:36px;text-align:right">${conf}%</span>
        <div style="margin-left:auto;display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text3)">
          <span>Min:</span>
          <input type="number" value="${minConf}" min="0" max="100" style="width:40px;padding:2px 4px;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:11px;text-align:center" onchange="updateStrategyConfig('${name}','minConfidence',+this.value)">
          <span>%</span>
          <select style="padding:2px 4px;background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:11px" onchange="updateStrategyConfig('${name}','target',this.value)">${tgtOpts}</select>
        </div>
      </div>
      ${s.reason ? `<div style="font-size:10px;color:var(--text3);margin-top:3px;padding-left:20px">${escapeHtml(s.reason)}</div>` : ''}
      ${s.pattern && s.pattern.length > 0 ? `<div style="margin-top:4px;padding-left:20px;display:flex;align-items:center;gap:4px;flex-wrap:wrap">${s.pattern.map(c => {
        const bg = c === 'RED' ? '#ef4444' : c === 'GREEN' ? '#22c55e' : c === 'BLUE' ? '#3b82f6' : c === 'GREY' || c === 'BLACK' ? '#374151' : '#666';
        const label = c === 'RED' ? 'V' : c === 'BLACK' ? 'P' : c === 'GREY' ? 'P' : c === 'GREEN' ? 'Vd' : c === 'BLUE' ? 'Az' : '?';
        return `<span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;background:${bg};font-size:9px;font-weight:700;color:white">${label}</span>`;
      }).join('<span style="color:var(--text3);font-size:9px">&rarr;</span>')}</div>` : ''}
    </div>`;
  }).join('');

  el.innerHTML = html;
}

function changePatternSize(name, delta) {
  if (!robotData) return;
  if (!robotData.strategyConfig) robotData.strategyConfig = {};
  if (!robotData.strategyConfig[name]) robotData.strategyConfig[name] = {};
  const defaultPS = { alternancia: 5, repeticao: 5, frequencia: 1, tendencia: 5, espelhamento: 5, diagonal: 6, padroesCores: 3 };
  let sz = (robotData.strategyConfig[name].patternSize || defaultPS[name] || 3) + delta;
  if (sz < 1) sz = 1;
  if (sz > 6) sz = 6;
  robotData.strategyConfig[name].patternSize = sz;
  if (name === 'padroesCores') robotData.patternSize = sz;
  const robot = RobotEngine.getRobot(robotData.id);
  if (robot) {
    robot.strategyConfig = robotData.strategyConfig;
    if (name === 'padroesCores') robot.patternSize = sz;
    robot.analyze();
    robotData = robot.getState();
    RobotEngine.save();
  }
  renderAll();
  renderAnalises();
}

function toggleStrategy(name, enabled) {
  if (!robotData) return;
  if (!robotData.strategyConfig) robotData.strategyConfig = {};
  if (!robotData.strategyConfig[name]) robotData.strategyConfig[name] = {};
  robotData.strategyConfig[name].enabled = enabled;
  const robot = RobotEngine.getRobot(robotData.id);
  if (robot) { robot.strategyConfig = robotData.strategyConfig; RobotEngine.save(); }
}

function updateStrategyConfig(name, key, value) {
  if (!robotData) return;
  if (!robotData.strategyConfig) robotData.strategyConfig = {};
  if (!robotData.strategyConfig[name]) robotData.strategyConfig[name] = {};
  robotData.strategyConfig[name][key] = value;
  const robot = RobotEngine.getRobot(robotData.id);
  if (robot) { robot.strategyConfig = robotData.strategyConfig; RobotEngine.save(); }
}

loadRobot();
renderConnectionStatus();
setInterval(loadRobot, 5000);
setInterval(renderConnectionStatus, 2000);
</script>
</body>
</html>
