<div class="container">
  <div class="card">
    <div class="card-header">
      <span class="card-title">Logs do Sistema</span>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm btn-ghost" onclick="setFilter('all')">Todos</button>
        <button class="btn btn-sm btn-ghost" onclick="setFilter('ia')">IA</button>
        <button class="btn btn-sm btn-ghost" onclick="setFilter('sinais')">Sinais</button>
        <button class="btn btn-sm btn-ghost" onclick="setFilter('erros')">Erros</button>
      </div>
    </div>
    <div class="feed" id="logsFeed" style="max-height:600px"></div>
  </div>
</div>

<script>
App.init();
function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  html.setAttribute('data-theme', isLight ? 'dark' : 'light');
  localStorage.setItem('theme', isLight ? 'dark' : 'light');
  const moon = document.getElementById('themeIconMoon');
  const sun = document.getElementById('themeIconSun');
  if (moon && sun) { moon.style.display = isLight ? 'none' : 'block'; sun.style.display = isLight ? 'block' : 'none'; }
}
(function() {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  const moon = document.getElementById('themeIconMoon');
  const sun = document.getElementById('themeIconSun');
  if (moon && sun) { moon.style.display = saved === 'light' ? 'none' : 'block'; sun.style.display = saved === 'light' ? 'block' : 'none'; }
})();
let logs = [];
let filter = 'all';
function setFilter(f){ filter = f; renderLogs(); }
function loadStoredLogs(){
  logs = RobotEngine.getAllStates()
    .flatMap(r => (r.logs || []).map(l => ({ ...l, id: l.id || r.id })))
    .sort((a,b) => (b.time || 0) - (a.time || 0))
    .slice(0,500);
  renderLogs();
}
function renderLogs(){
  const filtered = filter==='all'?logs:logs.filter(l=>{
    if(filter==='erros') return l.message.toLowerCase().includes('erro');
    if(filter==='sinais') return l.message.toLowerCase().includes('sinal');
    if(filter==='ia') return l.message.toLowerCase().includes('anal')||l.message.toLowerCase().includes('padrao')||l.message.toLowerCase().includes('confianca');
    return true;
  });
  document.getElementById('logsFeed').innerHTML = filtered.slice(0,200).map(e =>
    `<div class="feed-entry"><span class="feed-time">${formatTime(e.time)}</span> [${escapeHtml(e.id)}] ${escapeHtml(e.message)}</div>`
  ).join('');
}
EventBus.on('robot:log', (d) => { logs.unshift(d); if(logs.length>500) logs.pop(); renderLogs(); });
EventBus.on('signal:created', (d) => { logs.unshift({time:Date.now(),id:d.robotId,message:'Sinal criado: '+d.target}); renderLogs(); });
EventBus.on('signal:win', (d) => { logs.unshift({time:Date.now(),id:d.robotId,message:'WIN! '+d.target}); renderLogs(); });
EventBus.on('signal:loss', (d) => { logs.unshift({time:Date.now(),id:d.robotId,message:'LOSS! '+d.target}); renderLogs(); });
EventBus.on('robots:synced', loadStoredLogs);
loadStoredLogs();
</script>
