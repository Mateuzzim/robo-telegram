<script>
App.init();
function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  html.setAttribute('data-theme', isLight ? 'dark' : 'light');
  localStorage.setItem('theme', isLight ? 'dark' : 'light');
  const moon = document.getElementById('themeIconMoon');
  const sun = document.getElementById('themeIconSun');
  if (moon && sun) { moon.style.display = isLight ? 'none' : 'block'; sun.style.display = isLight ? 'block' : 'none'; }
}
(function() {
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  const moon = document.getElementById('themeIconMoon');
  const sun = document.getElementById('themeIconSun');
  if (moon && sun) { moon.style.display = saved === 'light' ? 'none' : 'block'; sun.style.display = saved === 'light' ? 'block' : 'none'; }
})();
const resultsEl = document.getElementById('results');
const countEl = document.getElementById('resultCount');
const connDot = document.getElementById('connDot');
const connText = document.getElementById('connText');
const STORAGE_KEY = 'historico-wheel-v1';
const MAX_RESULTS = 1000;
const DUPLICATE_WINDOW_MS = 15000;

function loadHistory() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (!Array.isArray(saved) || !saved.length) return [];
    const cleaned = removeImmediateDuplicates(saved);
    if (cleaned.length !== saved.length) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cleaned.slice(0, MAX_RESULTS)));
    }
    return cleaned;
  } catch {}
  return [];
}

function removeImmediateDuplicates(history) {
  const cleaned = [];
  for (const item of history) {
    if (!isImmediateDuplicate(cleaned[cleaned.length - 1], item)) {
      cleaned.push(item);
    }
  }
  return cleaned;
}

function isImmediateDuplicate(previous, item) {
  if (!previous || !item) return false;
  const previousRound = getRoundKey(previous);
  const itemRound = getRoundKey(item);
  if (previousRound && itemRound) return previousRound === itemRound;
  if (resultSignature(previous) !== resultSignature(item)) return false;
  const previousTime = getResultTime(previous);
  const itemTime = getResultTime(item);
  if (!previousTime || !itemTime) return true;
  return Math.abs(previousTime - itemTime) <= DUPLICATE_WINDOW_MS;
}

function getRoundKey(result) {
  const roundId = result.roundId ?? result.roundID ?? result.roundUuid ?? result.roundUUID ?? result.gameId ?? result.gameID ?? result.id ?? result.uuid;
  return roundId !== undefined && roundId !== null ? String(roundId) : '';
}

function resultSignature(result) {
  return [
    getNumber(result),
    getColor(result),
    result.multiplier || ''
  ].join(':');
}

function getResultTime(result) {
  return Number(result.time || result.timestamp || 0);
}

function render() {
  const history = loadHistory().slice(0, MAX_RESULTS);
  countEl.textContent = history.length + ' resultados';
  resultsEl.innerHTML = history.map(r => {
    const multiplier = r.multiplier ? `<span class="multiplier">${r.multiplier}X</span>` : '';
    return `<div class="result ${getColor(r)}"><span>${String(getNumber(r))}</span>${multiplier}</div>`;
  }).join('');
}

function getColor(result) {
  const c = String(result.cellColor ?? result.color ?? '').toLowerCase();
  if (c === 'red') return 'red';
  if (c === 'green') return 'green';
  if (c === 'white') return 'white';
  if (c === 'blue') return 'blue';
  if (c === 'grey' || c === 'gray') return 'grey';
  return 'black';
}

function getNumber(result) {
  return result.cellIndex ?? result.number ?? '';
}

EventBus.on('ws-status', (d) => {
  if (d.label === 'wheel') {
    connDot.className = 'dot' + (d.connected ? '' : ' off');
    connText.textContent = d.connected ? 'Online' : 'Offline';
  }
});

function renderConnectionStatus() {
  const status = App.getSourceStatus('wheel');
  connDot.className = 'dot' + (status.connected ? '' : ' off');
  connText.textContent = status.connected ? 'Online' : 'Offline';
}

EventBus.on('result:new', (d) => {
  if (d.label !== 'wheel') return;
  render();
});

EventBus.on('results:history', (d) => {
  if (d.label !== 'wheel') return;
  render();
});

window.addEventListener('storage', (e) => {
  if (e.key === STORAGE_KEY) render();
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') render();
});

render();
renderConnectionStatus();
setInterval(render, 3000);
setInterval(renderConnectionStatus, 2000);
</script>
