<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WS Background</title>
</head>
<body>
<p id="status" style="font:12px monospace;color:#666;padding:8px">WebSocket Background rodando...</p>
<script src="config.js"></script>
<script src="saved-data.js"></script>
<script src="store.js"></script>
<script src="event-bus.js"></script>
<script src="utils.js"></script>
<script src="ws-source.js"></script>
<script src="robot.js"></script>
<script src="robot-engine.js"></script>
<script src="telegram.js"></script>
<script src="app.js"></script>
<script>
App.init();

const statusEl = document.getElementById('status');

const KEYS = { wheel: 'historico-wheel-v1', double: 'historico-double-v1' };
const MAX_RESULTS = 500;
const DUPLICATE_WINDOW_MS = 15000;

function loadHistory(key) {
  try {
    const saved = JSON.parse(localStorage.getItem(key) || 'null');
    if (Array.isArray(saved)) return saved;
  } catch {}
  return [];
}

function saveHistory(key, data) {
  const seenRounds = new Set();
  const saved = [];
  for (const item of data) {
    const roundKey = stableKey(item);
    if (roundKey) {
      if (seenRounds.has(roundKey)) continue;
      seenRounds.add(roundKey);
    }
    saved.push(item);
  }
  localStorage.setItem(key, JSON.stringify(saved.slice(0, MAX_RESULTS)));
}

function normalizeColor(color) {
  return String(color || '').toLowerCase();
}

function resultKey(r) {
  const number = r.cellIndex ?? r.number ?? '';
  const color = normalizeColor(r.cellColor ?? r.color);
  return number + ':' + color + ':' + (r.multiplier || '');
}

function stableKey(r) {
  return r?.roundId ? 'round:' + r.roundId : '';
}

function createStorageId() {
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
}

function sameRoundOrResult(a, b) {
  const stableA = stableKey(a);
  const stableB = stableKey(b);
  if (stableA && stableB) return stableA === stableB;
  return resultKey(a) === resultKey(b);
}

function isDuplicate(previous, item) {
  if (!previous) return false;
  const stablePrevious = stableKey(previous);
  const stableItem = stableKey(item);
  if (stablePrevious && stableItem) return stablePrevious === stableItem;
  const previousTime = Number(previous.time || 0);
  const itemTime = Number(item.time || Date.now());
  return resultKey(previous) === resultKey(item) &&
    previousTime > 0 &&
    Math.abs(itemTime - previousTime) < DUPLICATE_WINDOW_MS;
}

function findSnapshotOverlap(incoming, history) {
  const max = Math.min(incoming.length, history.length);
  for (let size = max; size > 0; size--) {
    let matches = true;
    for (let i = 0; i < size; i++) {
      if (!sameRoundOrResult(incoming[incoming.length - size + i], history[i])) {
        matches = false;
        break;
      }
    }
    if (matches) return size;
  }
  return 0;
}

function addResult(label, data) {
  const key = KEYS[label];
  if (!key) return;
  const history = loadHistory(key);
  let item;
  if (label === 'wheel') {
    item = { cellIndex: data.number ?? data.cellIndex, cellColor: normalizeColor(data.color ?? data.cellColor), multiplier: data.multiplier, time: Date.now() };
  } else {
    item = { number: data.number ?? data.cellIndex, color: normalizeColor(data.color ?? data.cellColor), time: Date.now() };
  }
  if (data.roundId !== undefined && data.roundId !== null) item.roundId = String(data.roundId);
  else item.storageId = data.storageId || createStorageId();
  if (isDuplicate(history[0], item)) return;
  history.unshift(item);
  saveHistory(key, history);
  updateStatus(label, item);
}

function mergeHistory(label, results) {
  const key = KEYS[label];
  if (!key) return;
  const history = loadHistory(key);
  const incoming = results.map(r => {
    if (label === 'wheel') {
      const item = { cellIndex: r.number ?? r.cellIndex, cellColor: normalizeColor(r.color ?? r.cellColor), multiplier: r.multiplier, time: r.time || Date.now() };
      if (r.roundId !== undefined && r.roundId !== null) item.roundId = String(r.roundId);
      else item.storageId = r.storageId || createStorageId();
      return item;
    }
    const item = { number: r.number ?? r.cellIndex, color: normalizeColor(r.color ?? r.cellColor), time: r.time || Date.now() };
    if (r.roundId !== undefined && r.roundId !== null) item.roundId = String(r.roundId);
    else item.storageId = r.storageId || createStorageId();
    return item;
  });
  const overlap = findSnapshotOverlap(incoming, history);
  const merged = incoming.concat(history.slice(overlap)).slice(0, MAX_RESULTS);
  saveHistory(key, merged);
  updateStatus(label, merged[0]);
}

function updateStatus(label, item) {
  if (!item) return;
  const history = loadHistory(KEYS[label]);
  const color = normalizeColor(item.cellColor ?? item.color);
  const number = item.cellIndex ?? item.number ?? '--';
  statusEl.textContent = `[${new Date().toLocaleTimeString()}] ${label}: ${history.length} resultados | ultimo ${color} ${number}`;
}

EventBus.on('result:new', (d) => {
  if (d.label === 'wheel' || d.label === 'double') {
    addResult(d.label, d);
  }
});

EventBus.on('results:history', (d) => {
  if (d.label === 'wheel' || d.label === 'double') {
    mergeHistory(d.label, d.results);
  }
});

EventBus.on('ws-status', (d) => {
  statusEl.textContent = `[${new Date().toLocaleTimeString()}] ${d.label}: ${d.connected ? 'Online' : 'Offline'}`;
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (Sources.wheel && !Sources.wheel.connected) Sources.wheel.connect();
    if (Sources.double && !Sources.double.connected) Sources.double.connect();
    RobotEngine.syncHistoriesFromStorage();
  }
});

window.addEventListener('beforeunload', () => {
  if (Sources.wheel) Sources.wheel.disconnect();
  if (Sources.double) Sources.double.disconnect();
});

let _keepAliveCounter = 0;
setInterval(() => {
  _keepAliveCounter++;
  const statusParts = [];
  if (Sources.wheel) statusParts.push('wheel:' + (Sources.wheel.connected ? 'ON' : 'OFF'));
  if (Sources.double) statusParts.push('double:' + (Sources.double.connected ? 'ON' : 'OFF'));
  const robots = RobotEngine.getAllRobots().filter(r => r.status === 'online');
  statusParts.push('robots:' + robots.length);
  statusEl.textContent = '[' + new Date().toLocaleTimeString() + '] BG rodando | ' + statusParts.join(' | ') + ' | tick:' + _keepAliveCounter;
  if (Sources.wheel && !Sources.wheel.connected) Sources.wheel.connect();
  if (Sources.double && !Sources.double.connected) Sources.double.connect();
}, 3000);
</script>
</body>
</html>
